<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hooks 深入练习题参考答案</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1 { text-align: center; }
        h2 { color: #61dafb; border-bottom: 2px solid #61dafb; padding-bottom: 10px; }
        /* 数据获取卡片样式 */
        .data-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .data-card.loading { background: #fff3cd; }
        .data-card.error { background: #f8d7da; color: #721c24; }
        .data-card.success { background: #d4edda; }
        /* 主题切换样式 */
        .theme-provider { padding: 20px; border-radius: 8px; transition: all 0.3s; }
        .theme-provider.light { background: #ffffff; color: #333; }
        .theme-provider.dark { background: #333; color: #fff; }
        .theme-card { padding: 20px; border-radius: 8px; margin-top: 10px; }
        .theme-card.light { background: #f0f0f0; color: #333; }
        .theme-card.dark { background: #555; color: #fff; }
        /* 定时器样式 */
        .timer-display { font-size: 48px; font-family: monospace; text-align: center; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ========== 基础练习：useEffect 获取数据 ==========
        // 创建模拟 API
        const mockFetchUser = () => new Promise((resolve) => {
            setTimeout(() => {
                resolve({ id: 1, name: '张三', email: 'zhang@example.com', city: '北京' });
            }, 1000);
        });

        function UserProfile() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [error, setError] = React.useState(null);
            
            React.useEffect(() => {
                const fetchUser = async () => {
                    try {
                        setLoading(true);
                        const data = await mockFetchUser();
                        setUser(data);
                        setError(null);
                    } catch (err) {
                        setError('获取用户信息失败');
                    } finally {
                        setLoading(false);
                    }
                };
                
                fetchUser();
            }, []);
            
            if (loading) return <div className="data-card loading">加载中...</div>;
            if (error) return <div className="data-card error">{error}</div>;
            if (!user) return null;
            
            return (
                <div className="data-card success">
                    <h3>用户信息</h3>
                    <p><strong>姓名：</strong>{user.name}</p>
                    <p><strong>邮箱：</strong>{user.email}</p>
                    <p><strong>城市：</strong>{user.city}</p>
                    <button onClick={() => {
                        setLoading(true);
                        mockFetchUser().then(data => { setUser(data); setLoading(false); });
                    }}>刷新数据</button>
                </div>
            );
        }

        // ========== 进阶练习：useRef 自动聚焦 ==========
        function AutoFocusForm() {
            const nameRef = React.useRef(null);
            const emailRef = React.useRef(null);
            const [focusedField, setFocusedField] = React.useState('name');
            
            React.useEffect(() => {
                if (focusedField === 'name' && nameRef.current) {
                    nameRef.current.focus();
                } else if (focusedField === 'email' && emailRef.current) {
                    emailRef.current.focus();
                }
            }, [focusedField]);
            
            return (
                <div>
                    <h3>自动聚焦表单</h3>
                    <div style={{ marginBottom: '10px' }}>
                        <label>姓名：</label>
                        <input ref={nameRef} placeholder="自动聚焦" />
                    </div>
                    <div style={{ marginBottom: '10px' }}>
                        <label>邮箱：</label>
                        <input ref={emailRef} placeholder="自动聚焦" />
                    </div>
                    <div>
                        <button onClick={() => setFocusedField('name')}>聚焦姓名</button>
                        <button onClick={() => setFocusedField('email')}>聚焦邮箱</button>
                    </div>
                </div>
            );
        }

        // ========== 挑战练习：useContext 主题切换 ==========
        const ThemeContext = React.createContext('light');
        
        function ThemeProvider({ children }) {
            const [theme, setTheme] = React.useState('light');
            
            const toggleTheme = () => {
                setTheme(prev => prev === 'light' ? 'dark' : 'light');
            };
            
            return (
                <ThemeContext.Provider value={{ theme, toggleTheme }}>
                    {children}
                </ThemeContext.Provider>
            );
        }
        
        function useTheme() {
            const context = React.useContext(ThemeContext);
            if (!context) {
                throw new Error('useTheme 必须在 ThemeProvider 中使用');
            }
            return context;
        }
        
        function ThemeCard() {
            const { theme, toggleTheme } = useTheme();
            
            return (
                <div className={`theme-card ${theme}`}>
                    <p>当前主题：{theme === 'light' ? '亮色' : '暗色'}</p>
                    <button onClick={toggleTheme}>切换主题</button>
                </div>
            );
        }
        
        function ThemedApp() {
            const { theme } = useTheme();
            
            return (
                <div className={`theme-provider ${theme}`}>
                    <h3>主题切换演示</h3>
                    <p>这是使用 useContext 实现的主题切换功能。</p>
                    <ThemeCard />
                </div>
            );
        }
        
        function ThemeDemo() {
            return (
                <ThemeProvider>
                    <ThemedApp />
                </ThemeProvider>
            );
        }

        // ========== 额外示例：useEffect + useRef ==========
        function SearchWithDebounce() {
            const [query, setQuery] = React.useState('');
            const [results, setResults] = React.useState([]);
            const [isSearching, setIsSearching] = React.useState(false);
            const timeoutRef = React.useRef();
            
            React.useEffect(() => {
                if (timeoutRef.current) {
                    clearTimeout(timeoutRef.current);
                }
                
                if (query.trim()) {
                    setIsSearching(true);
                    timeoutRef.current = setTimeout(async () => {
                        // 模拟搜索
                        await new Promise(r => setTimeout(r, 500));
                        setResults([`结果1: ${query}`, `结果2: ${query}`, `结果3: ${query}`]);
                        setIsSearching(false);
                    }, 500);
                } else {
                    setResults([]);
                }
                
                return () => {
                    if (timeoutRef.current) {
                        clearTimeout(timeoutRef.current);
                    }
                };
            }, [query]);
            
            return (
                <div>
                    <h3>搜索演示（防抖）</h3>
                    <input
                        value={query}
                        onChange={(e) => setQuery(e.target.value)}
                        placeholder="输入搜索内容..."
                        style={{ width: '100%', padding: '10px' }}
                    />
                    {isSearching && <p>搜索中...</p>}
                    <ul>
                        {results.map((result, i) => (
                            <li key={i}>{result}</li>
                        ))}
                    </ul>
                </div>
            );
        }

        // ========== 主应用 ==========
        function App() {
            return (
                <div>
                    <h1>Hooks 深入练习题参考答案</h1>
                    
                    <section className="section">
                        <h2>基础练习：useEffect 获取数据</h2>
                        <UserProfile />
                    </section>
                    
                    <section className="section">
                        <h2>进阶练习：useRef 自动聚焦</h2>
                        <AutoFocusForm />
                    </section>
                    
                    <section className="section">
                        <h2>挑战练习：useContext 主题切换</h2>
                        <ThemeDemo />
                    </section>
                    
                    <section className="section">
                        <h2>额外示例：搜索防抖</h2>
                        <SearchWithDebounce />
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
