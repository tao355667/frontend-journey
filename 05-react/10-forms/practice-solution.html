<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单处理练习题参考答案</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1 { text-align: center; }
        h2 { color: #61dafb; border-bottom: 2px solid #61dafb; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group input.error { border-color: #dc3545; }
        .error-msg { color: #dc3545; font-size: 12px; margin-top: 5px; }
        .success-msg { color: #28a745; font-size: 12px; margin-top: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        /* 多步骤表单样式 */
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .step { width: 30px; height: 30px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; }
        .step.active { background: #007bff; color: white; }
        .step.completed { background: #28a745; color: white; }
        .step-line { flex: 1; height: 2px; background: #ddd; margin: 0 5px; }
        .step-line.active { background: #007bff; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ========== 基础练习：用户注册表单 ==========
        function RegistrationForm() {
            const [form, setForm] = React.useState({
                username: '',
                email: '',
                password: ''
            });
            
            const handleChange = (e) => {
                const { name, value } = e.target;
                setForm(prev => ({ ...prev, [name]: value }));
            };
            
            const handleSubmit = (e) => {
                e.preventDefault();
                alert('注册信息：\n用户名：' + form.username + '\n邮箱：' + form.email);
            };
            
            return (
                <form onSubmit={handleSubmit}>
                    <h3>用户注册</h3>
                    <div className="form-group">
                        <label>用户名</label>
                        <input name="username" value={form.username} onChange={handleChange} required />
                    </div>
                    <div className="form-group">
                        <label>邮箱</label>
                        <input name="email" type="email" value={form.email} onChange={handleChange} required />
                    </div>
                    <div className="form-group">
                        <label>密码</label>
                        <input name="password" type="password" value={form.password} onChange={handleChange} required minLength="6" />
                    </div>
                    <button type="submit">注册</button>
                </form>
            );
        }

        // ========== 进阶练习：带实时验证的联系表单 ==========
        function ContactForm() {
            const [form, setForm] = React.useState({
                name: '',
                email: '',
                phone: '',
                message: ''
            });
            const [errors, setErrors] = React.useState({});
            const [touched, setTouched] = React.useState({});
            
            const validateField = (name, value) => {
                switch (name) {
                    case 'name':
                        if (!value.trim()) return '姓名不能为空';
                        if (value.trim().length < 2) return '姓名至少2个字符';
                        return '';
                    case 'email':
                        if (!value) return '邮箱不能为空';
                        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return '邮箱格式不正确';
                        return '';
                    case 'phone':
                        if (!value) return '手机号不能为空';
                        if (!/^1[3-9]\d{9}$/.test(value)) return '请输入正确的手机号';
                        return '';
                    case 'message':
                        if (!value.trim()) return '消息不能为空';
                        if (value.length < 10) return '消息至少10个字符';
                        return '';
                    default:
                        return '';
                }
            };
            
            const handleChange = (e) => {
                const { name, value } = e.target;
                setForm(prev => ({ ...prev, [name]: value }));
                if (touched[name]) {
                    setErrors(prev => ({ ...prev, [name]: validateField(name, value) }));
                }
            };
            
            const handleBlur = (e) => {
                const { name, value } = e.target;
                setTouched(prev => ({ ...prev, [name]: true }));
                setErrors(prev => ({ ...prev, [name]: validateField(name, value) }));
            };
            
            const handleSubmit = (e) => {
                e.preventDefault();
                const newErrors = {};
                Object.keys(form).forEach(key => {
                    newErrors[key] = validateField(key, form[key]);
                });
                setErrors(newErrors);
                setTouched({ name: true, email: true, phone: true, message: true });
                
                if (Object.values(newErrors).every(e => !e)) {
                    alert('表单验证通过！\n' + JSON.stringify(form, null, 2));
                }
            };
            
            const isValid = Object.values(errors).every(e => !e) && Object.values(form).every(v => v);
            
            return (
                <form onSubmit={handleSubmit}>
                    <h3>联系表单</h3>
                    <div className="form-group">
                        <label>姓名</label>
                        <input
                            name="name"
                            value={form.name}
                            onChange={handleChange}
                            onBlur={handleBlur}
                            className={touched.name && errors.name ? 'error' : ''}
                        />
                        {touched.name && errors.name && <p className="error-msg">{errors.name}</p>}
                    </div>
                    <div className="form-group">
                        <label>邮箱</label>
                        <input
                            name="email"
                            type="email"
                            value={form.email}
                            onChange={handleChange}
                            onBlur={handleBlur}
                            className={touched.email && errors.email ? 'error' : ''}
                        />
                        {touched.email && errors.email && <p className="error-msg">{errors.email}</p>}
                    </div>
                    <div className="form-group">
                        <label>手机号</label>
                        <input
                            name="phone"
                            value={form.phone}
                            onChange={handleChange}
                            onBlur={handleBlur}
                            className={touched.phone && errors.phone ? 'error' : ''}
                        />
                        {touched.phone && errors.phone && <p className="error-msg">{errors.phone}</p>}
                    </div>
                    <div className="form-group">
                        <label>消息</label>
                        <textarea
                            name="message"
                            value={form.message}
                            onChange={handleChange}
                            onBlur={handleBlur}
                            rows={4}
                            className={touched.message && errors.message ? 'error' : ''}
                        />
                        {touched.message && errors.message && <p className="error-msg">{errors.message}</p>}
                    </div>
                    <button type="submit" disabled={!isValid}>提交</button>
                </form>
            );
        }

        // ========== 挑战练习：多步骤注册表单 ==========
        function MultiStepRegistration() {
            const [step, setStep] = React.useState(1);
            const [form, setForm] = React.useState({
                name: '',
                email: '',
                password: '',
                confirmPassword: ''
            });
            const [errors, setErrors] = React.useState({});
            
            const steps = [
                { number: 1, title: '基本信息' },
                { number: 2, title: '账户信息' },
                { number: 3, title: '确认信息' }
            ];
            
            const validateStep = (currentStep) => {
                const newErrors = {};
                if (currentStep === 1) {
                    if (!form.name.trim()) newErrors.name = '姓名不能为空';
                    if (form.name.length < 2) newErrors.name = '姓名至少2个字符';
                }
                if (currentStep === 2) {
                    if (!form.email) newErrors.email = '邮箱不能为空';
                    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) newErrors.email = '邮箱格式不正确';
                    if (!form.password) newErrors.password = '密码不能为空';
                    else if (form.password.length < 8) newErrors.password = '密码至少8个字符';
                    if (form.password !== form.confirmPassword) newErrors.confirmPassword = '两次密码不一致';
                }
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };
            
            const handleNext = () => {
                if (validateStep(step)) {
                    setStep(prev => prev + 1);
                }
            };
            
            const handlePrev = () => {
                setStep(prev => prev - 1);
            };
            
            const handleChange = (e) => {
                const { name, value } = e.target;
                setForm(prev => ({ ...prev, [name]: value }));
            };
            
            const handleSubmit = () => {
                alert('注册成功！\n' + JSON.stringify(form, null, 2));
            };
            
            return (
                <div>
                    <h3>多步骤注册</h3>
                    <div className="step-indicator">
                        {steps.map((s, i) => (
                            <React.Fragment key={s.number}>
                                <div className={`step ${step === s.number ? 'active' : ''} ${step > s.number ? 'completed' : ''}`}>
                                    {step > s.number ? '✓' : s.number}
                                </div>
                                {i < steps.length - 1 && <div className={`step-line ${step > s.number ? 'active' : ''}`} />}
                            </React.Fragment>
                        ))}
                    </div>
                    
                    <div className="form-step">
                        {step === 1 && (
                            <>
                                <h4>基本信息</h4>
                                <div className="form-group">
                                    <label>姓名</label>
                                    <input name="name" value={form.name} onChange={handleChange} />
                                    {errors.name && <p className="error-msg">{errors.name}</p>}
                                </div>
                            </>
                        )}
                        
                        {step === 2 && (
                            <>
                                <h4>账户信息</h4>
                                <div className="form-group">
                                    <label>邮箱</label>
                                    <input name="email" type="email" value={form.email} onChange={handleChange} />
                                    {errors.email && <p className="error-msg">{errors.email}</p>}
                                </div>
                                <div className="form-group">
                                    <label>密码</label>
                                    <input name="password" type="password" value={form.password} onChange={handleChange} />
                                    {errors.password && <p className="error-msg">{errors.password}</p>}
                                </div>
                                <div className="form-group">
                                    <label>确认密码</label>
                                    <input name="confirmPassword" type="password" value={form.confirmPassword} onChange={handleChange} />
                                    {errors.confirmPassword && <p className="error-msg">{errors.confirmPassword}</p>}
                                </div>
                            </>
                        )}
                        
                        {step === 3 && (
                            <>
                                <h4>确认信息</h4>
                                <p><strong>姓名：</strong>{form.name}</p>
                                <p><strong>邮箱：</strong>{form.email}</p>
                                <p><strong>密码：</strong>{'*'.repeat(form.password.length)}</p>
                            </>
                        )}
                        
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '20px' }}>
                            <button onClick={handlePrev} disabled={step === 1}>上一步</button>
                            {step < 3 ? (
                                <button onClick={handleNext}>下一步</button>
                            ) : (
                                <button onClick={handleSubmit}>完成注册</button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ========== 主应用 ==========
        function App() {
            return (
                <div>
                    <h1>表单处理练习题参考答案</h1>
                    
                    <section className="section">
                        <h2>基础练习：用户注册表单</h2>
                        <RegistrationForm />
                    </section>
                    
                    <section className="section">
                        <h2>进阶练习：带实时验证的联系表单</h2>
                        <ContactForm />
                    </section>
                    
                    <section className="section">
                        <h2>挑战练习：多步骤注册表单</h2>
                        <MultiStepRegistration />
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
