<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组件通信练习题参考答案</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1 { text-align: center; }
        h2 { color: #61dafb; border-bottom: 2px solid #61dafb; padding-bottom: 10px; }
        /* 计数器样式 */
        .counter { text-align: center; }
        .counter .display { font-size: 48px; font-weight: bold; margin: 20px 0; }
        .counter button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
        /* 评论卡片样式 */
        .comment { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin: 10px 0; }
        .comment-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .comment-author { font-weight: bold; }
        .comment-likes button { cursor: pointer; }
        /* 购物车样式 */
        .cart-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .cart-item .info { flex: 1; }
        .cart-item .quantity { display: flex; align-items: center; gap: 10px; }
        .cart-item button { width: 30px; height: 30px; cursor: pointer; }
        .cart-summary { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 10px; }
        .cart-summary .total { font-size: 20px; font-weight: bold; color: #e74c3c; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ========== 基础练习：计数器 ==========
        function CounterApp() {
            const [count, setCount] = React.useState(0);
            
            const increment = () => setCount(c => c + 1);
            const decrement = () => setCount(c => c - 1);
            const reset = () => setCount(0);
            
            return (
                <div className="counter">
                    <h3>计数器</h3>
                    <div className="display">{count}</div>
                    <button onClick={decrement}>-</button>
                    <button onClick={reset}>重置</button>
                    <button onClick={increment}>+</button>
                </div>
            );
        }

        // ========== 进阶练习：评论系统 ==========
        function CommentApp() {
            const [comments, setComments] = React.useState([
                { id: 1, author: '张三', content: '写得很好！', likes: 5, date: '2024-01-30' },
                { id: 2, author: '李四', content: '很有帮助，谢谢！', likes: 3, date: '2024-01-29' }
            ]);
            
            const addComment = (author, content) => {
                const newComment = {
                    id: Date.now(),
                    author,
                    content,
                    likes: 0,
                    date: new Date().toISOString().split('T')[0]
                };
                setComments([newComment, ...comments]);
            };
            
            const likeComment = (id) => {
                setComments(comments.map(c =>
                    c.id === id ? { ...c, likes: c.likes + 1 } : c
                ));
            };
            
            const deleteComment = (id) => {
                setComments(comments.filter(c => c.id !== id));
            };
            
            return (
                <div>
                    <CommentForm onAdd={addComment} />
                    <CommentList
                        comments={comments}
                        onLike={likeComment}
                        onDelete={deleteComment}
                    />
                </div>
            );
        }

        function CommentForm({ onAdd }) {
            const [author, setAuthor] = React.useState('');
            const [content, setContent] = React.useState('');
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (author.trim() && content.trim()) {
                    onAdd(author, content);
                    setAuthor('');
                    setContent('');
                }
            };
            
            return (
                <form onSubmit={handleSubmit} style={{ marginBottom: '20px' }}>
                    <h4>发表评论</h4>
                    <div style={{ marginBottom: '10px' }}>
                        <input
                            value={author}
                            onChange={(e) => setAuthor(e.target.value)}
                            placeholder="昵称"
                            style={{ width: '100%', padding: '8px' }}
                        />
                    </div>
                    <div style={{ marginBottom: '10px' }}>
                        <textarea
                            value={content}
                            onChange={(e) => setContent(e.target.value)}
                            placeholder="评论内容"
                            style={{ width: '100%', padding: '8px', height: '80px' }}
                        />
                    </div>
                    <button type="submit">发布评论</button>
                </form>
            );
        }

        function CommentList({ comments, onLike, onDelete }) {
            return (
                <div>
                    <h4>评论列表 ({comments.length})</h4>
                    {comments.map(comment => (
                        <div key={comment.id} className="comment">
                            <div className="comment-header">
                                <span className="comment-author">{comment.author}</span>
                                <span style={{ color: '#999' }}>{comment.date}</span>
                            </div>
                            <p>{comment.content}</p>
                            <div className="comment-likes">
                                <button onClick={() => onLike(comment.id)}>
                                    👍 {comment.likes}
                                </button>
                                <button
                                    onClick={() => {
                                        if (confirm('确定删除？')) onDelete(comment.id);
                                    }}
                                    style={{ marginLeft: '10px', color: '#dc3545' }}
                                >
                                    删除
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // ========== 挑战练习：购物车 ==========
        function ShoppingCartApp() {
            const [cart, setCart] = React.useState([
                { id: 1, name: 'React 入门指南', price: 59.00, quantity: 1 },
                { id: 2, name: 'JavaScript 高级编程', price: 89.00, quantity: 2 },
                { id: 3, name: 'CSS 权威指南', price: 79.00, quantity: 1 }
            ]);
            
            const updateQuantity = (id, delta) => {
                setCart(cart.map(item => {
                    if (item.id === id) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };
            
            const removeItem = (id) => {
                setCart(cart.filter(item => item.id !== id));
            };
            
            const clearCart = () => {
                setCart([]);
            };
            
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const shipping = subtotal > 100 ? 0 : 10;
            const total = subtotal + shipping;
            
            return (
                <div>
                    <h3>购物车</h3>
                    {cart.length === 0 ? (
                        <p style={{ textAlign: 'center', color: '#999', padding: '40px' }}>
                            购物车是空的
                        </p>
                    ) : (
                        <>
                            {cart.map(item => (
                                <div key={item.id} className="cart-item">
                                    <div className="info">
                                        <strong>{item.name}</strong>
                                        <br />
                                        <small>¥{item.price.toFixed(2)} × {item.quantity}</small>
                                    </div>
                                    <div className="quantity">
                                        <button onClick={() => updateQuantity(item.id, -1)}>-</button>
                                        <span>{item.quantity}</span>
                                        <button onClick={() => updateQuantity(item.id, 1)}>+</button>
                                        <button
                                            onClick={() => removeItem(item.id)}
                                            style={{ marginLeft: '10px', background: '#dc3545', color: 'white', border: 'none', borderRadius: '4px', padding: '5px 10px' }}
                                        >
                                            删除
                                        </button>
                                    </div>
                                </div>
                            ))}
                            
                            <div className="cart-summary">
                                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                    <span>小计:</span>
                                    <span>¥{subtotal.toFixed(2)}</span>
                                </div>
                                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                    <span>运费:</span>
                                    <span>{shipping === 0 ? '免运费' : `¥${shipping.toFixed(2)}`}</span>
                                </div>
                                {subtotal < 100 && (
                                    <p style={{ color: '#e74c3c', fontSize: '12px' }}>
                                        再买 ¥{(100 - subtotal).toFixed(2)} 即可免运费
                                    </p>
                                )}
                                <div className="total" style={{ display: 'flex', justifyContent: 'space-between', marginTop: '10px', paddingTop: '10px', borderTop: '1px solid #ddd' }}>
                                    <span>总计:</span>
                                    <span>¥{total.toFixed(2)}</span>
                                </div>
                                <button
                                    onClick={clearCart}
                                    style={{ marginTop: '10px', background: '#6c757d', color: 'white', border: 'none', borderRadius: '4px', padding: '10px 20px' }}
                                >
                                    清空购物车
                                </button>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        // ========== 主应用 ==========
        function App() {
            return (
                <div>
                    <h1>组件通信练习题参考答案</h1>
                    
                    <section className="section">
                        <h2>基础练习：计数器</h2>
                        <CounterApp />
                    </section>
                    
                    <section className="section">
                        <h2>进阶练习：评论系统</h2>
                        <CommentApp />
                    </section>
                    
                    <section className="section">
                        <h2>挑战练习：购物车</h2>
                        <ShoppingCartApp />
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
