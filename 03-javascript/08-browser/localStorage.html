<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localStorage 示例</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        input, button { padding: 8px; margin: 5px; }
        button { background-color: #007bff; color: white; border: none; border-radius:3px; cursor: pointer; }
        .storage-display { background-color: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>localStorage 示例</h1>
    
    <div class="container">
        <h2>存储数据</h2>
        <input type="text" id="keyInput" placeholder="键名">
        <input type="text" id="valueInput" placeholder="值">
        <button onclick="saveToLocalStorage()">保存</button>
        <button onclick="getFromLocalStorage()">获取</button>
        <button onclick="removeFromLocalStorage()">删除</button>
        <button onclick="clearLocalStorage()">清空全部</button>
    </div>
    
    <div class="container">
        <h2>用户信息示例</h2>
        <input type="text" id="userName" placeholder="姓名">
        <input type="email" id="userEmail" placeholder="邮箱">
        <button onclick="saveProfile()">保存信息</button>
        <button onclick="loadProfile()">加载信息</button>
    </div>
    
    <div class="container">
        <h2>当前 localStorage 数据</h2>
        <div id="storageDisplay" class="storage-display">没有存储数据</div>
        <button onclick="displayStorage()">刷新显示</button>
    </div>

    <script>
        // 基本 localStorage 操作
        function saveToLocalStorage() {
            const key = document.getElementById('keyInput').value;
            const value = document.getElementById('valueInput').value;
            
            if (key && value) {
                localStorage.setItem(key, value);
                alert('数据已保存到 localStorage！');
                displayStorage();
                
                document.getElementById('keyInput').value = '';
                document.getElementById('valueInput').value = '';
            } else {
                alert('请输入键名和值');
            }
        }
        
        function getFromLocalStorage() {
            const key = document.getElementById('keyInput').value;
            
            if (key) {
                const value = localStorage.getItem(key);
                if (value !== null) {
                    document.getElementById('valueInput').value = value;
                    alert(`获取到: ${value}`);
                } else {
                    alert('在 localStorage 中未找到该键');
                }
            } else {
                alert('请输入键名');
            }
        }
        
        function removeFromLocalStorage() {
            const key = document.getElementById('keyInput').value;
            
            if (key) {
                localStorage.removeItem(key);
                alert('已从 localStorage 删除该项！');
                displayStorage();
            } else {
                alert('请输入要删除的键名');
            }
        }
        
        function clearLocalStorage() {
            if (confirm('确定要清空所有 localStorage 数据吗？')) {
                localStorage.clear();
                alert('localStorage 已清空！');
                displayStorage();
            }
        }
        
        // 用户信息示例
        function saveProfile() {
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            
            if (name && email) {
                const profile = {
                    name: name,
                    email: email,
                    savedAt: new Date().toISOString()
                };
                
                localStorage.setItem('userProfile', JSON.stringify(profile));
                alert('用户信息已保存！');
                displayStorage();
            } else {
                alert('请输入姓名和邮箱');
            }
        }
        
        function loadProfile() {
            const profileData = localStorage.getItem('userProfile');
            
            if (profileData) {
                const profile = JSON.parse(profileData);
                document.getElementById('userName').value = profile.name || '';
                document.getElementById('userEmail').value = profile.email || '';
                alert(`用户信息已加载！保存时间: ${profile.savedAt}`);
            } else {
                alert('在 localStorage 中未找到用户信息');
            }
        }
        
        // 显示所有 localStorage 数据
        function displayStorage() {
            const display = document.getElementById('storageDisplay');
            
            if (localStorage.length === 0) {
                display.textContent = '没有存储数据';
                return;
            }
            
            let output = '<strong>localStorage 内容:</strong><br>';
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                output += `<br><strong>${key}:</strong> ${value}`;
            }
            
            display.innerHTML = output;
        }
        
        // 高级示例：购物车
        let cart = [];
        
        function addToCart(item) {
            cart.push(item);
            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            console.log('购物车已更新:', cart);
        }
        
        function getCart() {
            const cartData = localStorage.getItem('shoppingCart');
            return cartData ? JSON.parse(cartData) : [];
        }
        
        // 页面加载时初始化
        window.onload = function() {
            displayStorage();
            
            const profileData = localStorage.getItem('userProfile');
            if (profileData) {
                console.log('在 localStorage 中找到用户信息');
            }
            
            setTimeout(() => {
                addToCart({ id: 1, name: '商品 1', price: 19.99 });
                addToCart({ id: 2, name: '商品 2', price: 29.99 });
                console.log('已添加示例购物车商品');
            }, 2000);
        };
        
        // 监听存储变化（来自其他标签页）
        window.addEventListener('storage', function(e) {
            console.log('存储已变化:', e.key, e.newValue);
            displayStorage();
        });
    </script>
</body>
</html>
