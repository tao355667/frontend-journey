<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第二十三章：provide 与 inject - JavaScript 示例</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .demo-section {
      border: 1px solid #ddd;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
    .demo-title {
      color: #42b983;
      margin-top: 0;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      background: #42b983;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #369870;
    }
    .info-box {
      background: #f0f8ff;
      padding: 15px;
      border-left: 4px solid #42b983;
      margin: 10px 0;
    }
    .component-box {
      border: 2px solid #ddd;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .level-1 { border-color: #42b983; background: #f0fff4; }
    .level-2 { border-color: #409eff; background: #f0f8ff; margin-left: 20px; }
    .level-3 { border-color: #e6a23c; background: #fff9f0; margin-left: 40px; }
    .theme-dark {
      background: #333 !important;
      color: white !important;
    }
    .theme-light {
      background: white !important;
      color: #333 !important;
    }
  </style>
</head>
<body>
  <h1>第二十三章：provide 与 inject</h1>
  <p>本章演示 provide/inject 的跨层级数据传递。</p>

  <div id="app">
    <!-- 示例 1：基础 provide/inject -->
    <div class="demo-section">
      <h2 class="demo-title">示例 1：跨层级传递主题</h2>
      <theme-app></theme-app>
    </div>

    <!-- 示例 2：用户认证 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 2：全局用户状态</h2>
      <auth-app></auth-app>
    </div>

    <!-- 示例 3：Symbol Key -->
    <div class="demo-section">
      <h2 class="demo-title">示例 3：使用 Symbol 作为 Key</h2>
      <symbol-app></symbol-app>
    </div>
  </div>

  <script>
    const { createApp, provide, inject, ref, reactive, readonly } = Vue;

    // 示例 1：主题系统
    const DeepChild = {
      setup() {
        const theme = inject('theme');
        const toggleTheme = inject('toggleTheme');
        
        return { theme, toggleTheme };
      },
      template: `
        <div class="component-box level-3" :class="'theme-' + theme">
          <h4>深层子组件（第 3 层）</h4>
          <p>当前主题：{{ theme }}</p>
          <button @click="toggleTheme">切换主题</button>
        </div>
      `
    };

    const MiddleComponent = {
      components: { DeepChild },
      template: `
        <div class="component-box level-2">
          <h4>中间组件（第 2 层）</h4>
          <p>这个组件不需要知道主题数据</p>
          <deep-child></deep-child>
        </div>
      `
    };

    const ThemeApp = {
      components: { MiddleComponent },
      setup() {
        const theme = ref('light');
        
        const toggleTheme = () => {
          theme.value = theme.value === 'light' ? 'dark' : 'light';
        };
        
        // 提供数据和方法
        provide('theme', theme);
        provide('toggleTheme', toggleTheme);
        
        return { theme };
      },
      template: `
        <div class="component-box level-1" :class="'theme-' + theme">
          <h4>根组件（第 1 层）</h4>
          <p>当前主题：{{ theme }}</p>
          <button @click="theme = theme === 'light' ? 'dark' : 'light'">
            在根组件切换主题
          </button>
          <middle-component></middle-component>
        </div>
      `
    };

    // 示例 2：用户认证系统
    const UserProfile = {
      setup() {
        const user = inject('user');
        const logout = inject('logout');
        
        return { user, logout };
      },
      template: `
        <div class="component-box level-3">
          <div v-if="user">
            <h4>用户资料</h4>
            <p>姓名：{{ user.name }}</p>
            <p>角色：{{ user.role }}</p>
            <button @click="logout">退出登录</button>
          </div>
          <div v-else>
            <p>未登录</p>
          </div>
        </div>
      `
    };

    const Navbar = {
      components: { UserProfile },
      setup() {
        const user = inject('user');
        
        return { user };
      },
      template: `
        <div class="component-box level-2">
          <h4>导航栏</h4>
          <span v-if="user">
            欢迎，{{ user.name }}（{{ user.role }}）
          </span>
          <span v-else>游客</span>
          <user-profile></user-profile>
        </div>
      `
    };

    const LoginForm = {
      setup() {
        const user = inject('user');
        const login = inject('login');
        const username = ref('');
        
        const handleLogin = () => {
          if (username.value.trim()) {
            login({
              name: username.value,
              role: '普通用户'
            });
          }
        };
        
        return { user, username, handleLogin };
      },
      template: `
        <div v-if="!user" class="component-box level-2">
          <h4>登录</h4>
          <input v-model="username" placeholder="输入用户名">
          <button @click="handleLogin">登录</button>
        </div>
      `
    };

    const AuthApp = {
      components: { Navbar, LoginForm },
      setup() {
        const user = ref(null);
        
        const login = (userData) => {
          user.value = userData;
        };
        
        const logout = () => {
          user.value = null;
        };
        
        // 提供只读的用户数据和操作方法
        provide('user', readonly(user));
        provide('login', login);
        provide('logout', logout);
        
        return {};
      },
      template: `
        <div class="component-box level-1">
          <h4>应用根组件</h4>
          <navbar></navbar>
          <login-form></login-form>
          <div class="info-box">
            <strong>说明：</strong>Navbar 和 LoginForm 是兄弟组件，
            UserProfile 是 Navbar 的深层子组件，都可以通过 inject 访问用户数据。
          </div>
        </div>
      `
    };

    // 示例 3：Symbol Key
    const ConfigKey = Symbol('config');
    const MessageKey = Symbol('message');

    const ConfigConsumer = {
      setup() {
        const config = inject(ConfigKey);
        const message = inject(MessageKey, '默认值');
        
        return { config, message };
      },
      template: `
        <div class="component-box level-2">
          <h4>配置消费者</h4>
          <p>API URL: {{ config.apiUrl }}</p>
          <p>超时时间: {{ config.timeout }}ms</p>
          <p>消息: {{ message }}</p>
        </div>
      `
    };

    const SymbolApp = {
      components: { ConfigConsumer },
      setup() {
        const config = reactive({
          apiUrl: 'https://api.example.com',
          timeout: 5000,
          version: '1.0.0'
        });
        
        // 使用 Symbol 作为 key
        provide(ConfigKey, config);
        // 不提供 MessageKey，使用默认值
        
        return {};
      },
      template: `
        <div class="component-box level-1">
          <h4>Symbol Key 示例</h4>
          <config-consumer></config-consumer>
          <div class="info-box">
            <strong>Symbol 的好处：</strong><br>
            1. 避免命名冲突<br>
            2. 更加安全的封装<br>
            3. 清晰的依赖关系
          </div>
        </div>
      `
    };

    createApp({
      components: {
        ThemeApp,
        AuthApp,
        SymbolApp
      }
    }).mount('#app');
  </script>
</body>
</html>
