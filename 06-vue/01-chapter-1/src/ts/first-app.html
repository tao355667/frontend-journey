<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第一个 Vue 应用 - TypeScript 版本</title>
  <!-- 引入 Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    #app {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }
    
    .counter-section {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    
    .count-display {
      font-size: 48px;
      font-weight: bold;
      color: #667eea;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-weight: 600;
    }
    
    .btn-increment {
      background: #42b883;
      color: white;
    }
    
    .btn-increment:hover {
      background: #369870;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(66, 184, 131, 0.4);
    }
    
    .btn-decrement {
      background: #ff6b6b;
      color: white;
    }
    
    .btn-decrement:hover {
      background: #ee5a5a;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
    }
    
    .btn-reset {
      background: #6c757d;
      color: white;
    }
    
    .btn-reset:hover {
      background: #5a6268;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(108, 117, 125, 0.4);
    }
    
    .status-message {
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 20px;
    }
    
    .status-high {
      background: #fff3cd;
      color: #856404;
      border: 2px solid #ffeaa7;
    }
    
    .status-low {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }
    
    .status-normal {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }
    
    .info-section {
      margin-top: 30px;
      padding: 20px;
      background: #e9ecef;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    .info-section h3 {
      color: #667eea;
      margin-bottom: 10px;
    }
    
    .info-section p {
      color: #666;
      line-height: 1.6;
    }
    
    code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      color: #d63384;
    }
    
    .typescript-badge {
      display: inline-block;
      background: #3178c6;
      color: white;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>
      {{ title }}
      <span class="typescript-badge">TypeScript</span>
    </h1>
    
    <div class="counter-section">
      <div class="count-display">{{ count }}</div>
      
      <div class="buttons">
        <button class="btn-increment" @click="increment">
          ➕ 增加
        </button>
        <button class="btn-decrement" @click="decrement">
          ➖ 减少
        </button>
        <button class="btn-reset" @click="reset">
          🔄 重置
        </button>
      </div>
      
      <div 
        class="status-message"
        :class="statusClass"
      >
        {{ statusMessage }}
      </div>
    </div>
    
    <div class="info-section">
      <h3>💡 TypeScript 特点</h3>
      <p>
        这个示例展示了 TypeScript 在 Vue 中的使用：<br>
        • <code>Ref&lt;string&gt;</code> - 明确指定 ref 的类型<br>
        • <code>(): void</code> - 函数返回类型声明<br>
        • <code>ComputedRef&lt;string&gt;</code> - 计算属性的类型<br>
        • 编译时类型检查，更好的 IDE 支持
      </p>
    </div>
  </div>

  <script type="module">
    // 在真实的 TypeScript 项目中，你会这样导入：
    // import { createApp, ref, computed } from 'vue'
    // import type { Ref, ComputedRef } from 'vue'
    
    // 这里我们使用全局 Vue 对象来模拟
    const { createApp, ref, computed } = Vue

    // TypeScript 接口定义（在实际项目中使用）
    // interface CounterState {
    //   title: Ref<string>
    //   count: Ref<number>
    //   increment: () => void
    //   decrement: () => void
    //   reset: () => void
    //   statusMessage: ComputedRef<string>
    //   statusClass: ComputedRef<string>
    // }

    createApp({
      setup() {
        // TypeScript 中可以明确指定类型
        // const title: Ref<string> = ref<string>('欢迎使用 Vue 3！')
        // const count: Ref<number> = ref<number>(0)
        
        // 或者让 TypeScript 自动推断类型
        const title = ref('欢迎使用 Vue 3！')  // 类型推断为 Ref<string>
        const count = ref(0)                   // 类型推断为 Ref<number>

        // 显式声明函数返回类型
        const increment = (): void => {
          count.value++
          // TypeScript 会在编译时检查类型
          // count.value = 'string' // ❌ 错误：不能将类型"string"分配给类型"number"
        }

        const decrement = (): void => {
          count.value--
        }

        const reset = (): void => {
          count.value = 0
        }

        // 计算属性也有类型
        // const statusMessage: ComputedRef<string> = computed(() => {...})
        const statusMessage = computed((): string => {
          if (count.value > 5) {
            return '🔥 计数超过 5 了！'
          } else if (count.value < 0) {
            return '❄️ 计数小于 0 了！'
          } else {
            return '✅ 计数在正常范围内'
          }
        })

        const statusClass = computed((): string => {
          if (count.value > 5) return 'status-high'
          if (count.value < 0) return 'status-low'
          return 'status-normal'
        })

        // 返回的对象会被 TypeScript 检查类型
        return {
          title,
          count,
          increment,
          decrement,
          reset,
          statusMessage,
          statusClass
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
