<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第18章：混入 (Mixins) - TypeScript示例</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; color: #333; margin-bottom: 30px; }
    h2 { color: #42b883; margin: 30px 0 15px; border-bottom: 2px solid #42b883; padding-bottom: 10px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    .type-hint { background: #e3f2fd; border-left: 4px solid #2196f3; padding: 12px; margin: 10px 0; border-radius: 0 4px 4px 0; font-size: 13px; }
    .type-hint code { background: rgba(255,255,255,0.7); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; }
    
    .card { background: white; border-radius: 8px; padding: 20px; margin: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 5px; transition: all 0.2s; }
    .btn-primary { background: #42b883; color: white; }
    .btn-default { background: #e0e0e0; color: #333; }
    .btn:hover { opacity: 0.8; }
    
    .composable-demo { background: #f8f8f8; padding: 20px; border-radius: 8px; border: 2px dashed #42b883; }
    .composable-tag { display: inline-block; padding: 2px 8px; background: #e8f5e9; color: #2e7d32; border-radius: 4px; font-size: 12px; margin-left: 8px; }
    
    .counter { font-size: 36px; font-weight: bold; color: #42b883; text-align: center; padding: 15px; }
    
    .loading-box { background: #fff3e0; padding: 20px; border-radius: 8px; text-align: center; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #ff9800; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .log-output { background: #1e1e1e; color: #4ec9b0; padding: 15px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 12px; max-height: 150px; overflow-y: auto; margin-top: 15px; }
    .log-entry { margin: 2px 0; }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>Vue 3 + TypeScript：Mixins vs Composables</h1>
      
      <div class="type-hint">
        <strong>TypeScript 最佳实践：</strong><br>
        在 Vue 3 中，使用 Composables（组合式函数）替代 Mixins 可以获得更好的类型推断和 IDE 支持。<br>
        <code>const { count, increment } = useCounter() // 完全类型推断</code>
      </div>
      
      <h2>1. 使用 Composable 的计数器 <span class="composable-tag">推荐</span></h2>
      
      <div class="card">
        <div class="composable-demo">
          <typed-counter-composable />
        </div>
      </div>
      
      <h2>2. 使用 Composable 的加载状态 <span class="composable-tag">推荐</span></h2>
      
      <div class="card">
        <div class="composable-demo">
          <typed-loading-composable />
        </div>
      </div>
      
      <h2>3. 使用 Composable 的日志系统 <span class="composable-tag">推荐</span></h2>
      
      <div class="card">
        <div class="composable-demo">
          <typed-logger-composable />
        </div>
      </div>
      
      <h2>4. Composable 组合演示</h2>
      
      <div class="card">
        <p>在一个组件中使用多个 Composables：</p>
        <div class="composable-demo">
          <typed-combined-composables />
        </div>
      </div>
    </div>
  </div>

  <script>
    // TypeScript 类型定义（运行时模拟）
    /**
     * @typedef {Object} CounterComposable
     * @property {import('vue').Ref<number>} count
     * @property {import('vue').ComputedRef<number>} double
     * @property {import('vue').ComputedRef<boolean>} isEven
     * @property {() => void} increment
     * @property {() => void} decrement
     * @property {() => void} reset
     */

    /**
     * @typedef {Object} LoadingComposable
     * @property {import('vue').Ref<boolean>} loading
     * @property {import('vue').Ref<string>} message
     * @property {(text?: string) => void} start
     * @property {() => void} stop
     * @property {<T>(fn: () => Promise<T>, text?: string) => Promise<T>} withLoading
     */

    const { createApp, ref, computed, defineComponent } = Vue;

    // ========== Composables (替代 Mixins) ==========
    
    /**
     * 计数器 Composable
     * @param {number} [initialValue]
     * @returns {CounterComposable}
     */
    function useCounter(initialValue = 0) {
      /** @type {import('vue').Ref<number>} */
      const count = ref(initialValue);
      
      /** @type {import('vue').ComputedRef<number>} */
      const double = computed(() => count.value * 2);
      
      /** @type {import('vue').ComputedRef<boolean>} */
      const isEven = computed(() => count.value % 2 === 0);
      
      const increment = () => count.value++;
      const decrement = () => count.value--;
      const reset = () => count.value = initialValue;
      
      return {
        count,
        double,
        isEven,
        increment,
        decrement,
        reset
      };
    }
    
    /**
     * 加载状态 Composable
     * @returns {LoadingComposable}
     */
    function useLoading() {
      /** @type {import('vue').Ref<boolean>} */
      const loading = ref(false);
      
      /** @type {import('vue').Ref<string>} */
      const message = ref('加载中...');
      
      /**
       * @param {string} [text]
       */
      const start = (text) => {
        loading.value = true;
        if (text) message.value = text;
      };
      
      const stop = () => {
        loading.value = false;
      };
      
      /**
       * @template T
       * @param {() => Promise<T>} fn
       * @param {string} [text]
       * @returns {Promise<T>}
       */
      const withLoading = async (fn, text) => {
        start(text);
        try {
          return await fn();
        } finally {
          stop();
        }
      };
      
      return {
        loading,
        message,
        start,
        stop,
        withLoading
      };
    }
    
    /**
     * 日志 Composable
     * @param {string} [context]
     */
    function useLogger(context = 'App') {
      /** @type {import('vue').Ref<Array<{time: string, level: string, message: string}>>} */
      const logs = ref([]);
      
      /**
       * @param {string} message
       * @param {string} [level]
       */
      const log = (message, level = 'info') => {
        const entry = {
          time: new Date().toLocaleTimeString(),
          level,
          message: `[${context}] ${message}`
        };
        logs.value.unshift(entry);
        console[level](entry.message);
      };
      
      const info = (/** @type {string} */ msg) => log(msg, 'info');
      const warn = (/** @type {string} */ msg) => log(msg, 'warn');
      const error = (/** @type {string} */ msg) => log(msg, 'error');
      
      return {
        logs,
        log,
        info,
        warn,
        error
      };
    }

    // ========== 使用 Composables 的组件 ==========
    
    const TypedCounterComposable = defineComponent({
      template: `
        <div>
          <h4>类型安全的计数器 Composable</h4>
          <div class="counter">{{ count }}</div>
          <div style="text-align: center; color: #666; margin-bottom: 15px;">
            双倍: {{ double }} | {{ isEven ? '偶数' : '奇数' }}
          </div>
          <div style="text-align: center;">
            <button class="btn btn-primary" @click="increment">+1</button>
            <button class="btn btn-default" @click="decrement">-1</button>
            <button class="btn btn-default" @click="reset">重置</button>
          </div>
          <div class="type-hint" style="margin-top: 15px;">
            TypeScript 完全类型推断: count 是 Ref&lt;number&gt;, double 是 ComputedRef&lt;number&gt;
          </div>
        </div>
      `,
      setup() {
        // 使用 Composable，获得完整类型支持
        const { count, double, isEven, increment, decrement, reset } = useCounter(0);
        
        return {
          count,
          double,
          isEven,
          increment,
          decrement,
          reset
        };
      }
    });

    const TypedLoadingComposable = defineComponent({
      template: `
        <div>
          <h4>类型安全的加载 Composable</h4>
          <button class="btn btn-primary" @click="loadData" :disabled="loading">
            {{ loading ? message : '加载数据' }}
          </button>
          
          <div v-if="loading" class="loading-box" style="margin-top: 15px;">
            <div class="loading-spinner"></div>
            <div>{{ message }}</div>
          </div>
          
          <div v-else-if="data" style="margin-top: 15px; padding: 15px; background: #e8f5e9; border-radius: 4px;">
            <strong>加载完成!</strong><br>
            数据项数: {{ data.length }}
          </div>
          
          <div class="type-hint" style="margin-top: 15px;">
            withLoading 函数支持泛型 T，确保返回数据的类型安全
          </div>
        </div>
      `,
      setup() {
        const { loading, message, withLoading } = useLoading();
        /** @type {import('vue').Ref<Array<{id: number, name: string}> | null>} */
        const data = ref(null);
        
        const loadData = async () => {
          data.value = await withLoading(
            async () => {
              await new Promise(resolve => setTimeout(resolve, 1500));
              return [
                { id: 1, name: 'TypeScript' },
                { id: 2, name: 'Vue 3' },
                { id: 3, name: 'Composition API' }
              ];
            },
            '正在加载类型化数据...'
          );
        };
        
        return {
          loading,
          message,
          data,
          loadData
        };
      }
    });

    const TypedLoggerComposable = defineComponent({
      template: `
        <div>
          <h4>类型安全的日志 Composable</h4>
          <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn btn-primary" @click="info('普通消息')">Info</button>
            <button class="btn btn-default" @click="warn('警告消息')">Warn</button>
            <button class="btn btn-danger" @click="error('错误消息')">Error</button>
            <button class="btn btn-default" @click="logs = []">清空</button>
          </div>
          
          <div class="log-output">
            <div v-for="(log, index) in logs" :key="index" class="log-entry">
              <span style="color: #ce9178;">[{{ log.time }}]</span>
              <span :style="{ color: getLogColor(log.level) }"> {{ log.message }}</span>
            </div>
            <div v-if="logs.length === 0" style="color: #666;">暂无日志...</div>
          </div>
          
          <div class="type-hint" style="margin-top: 15px;">
            logs 是 Ref&lt;LogEntry[]&gt; 类型，提供完整的类型检查和自动补全
          </div>
        </div>
      `,
      setup() {
        const { logs, info, warn, error } = useLogger('TypedLoggerDemo');
        
        const getLogColor = (/** @type {string} */ level) => {
          const colors = {
            info: '#4ec9b0',
            warn: '#dcdcaa',
            error: '#f44747'
          };
          return colors[level] || '#4ec9b0';
        };
        
        return {
          logs,
          info,
          warn,
          error,
          getLogColor
        };
      }
    });

    const TypedCombinedComposables = defineComponent({
      template: `
        <div>
          <h4>多个 Composables 组合使用</h4>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
            <div style="text-align: center; padding: 15px; background: #e8f5e9; border-radius: 8px;">
              <div class="counter">{{ count }}</div>
              <div style="font-size: 12px; color: #666;">来自 useCounter</div>
            </div>
            <div style="text-align: center; padding: 15px; background: #e3f2fd; border-radius: 8px;">
              <div style="font-size: 24px; font-weight: bold; color: #2196f3;">
                {{ loading ? '加载中' : '就绪' }}
              </div>
              <div style="font-size: 12px; color: #666;">来自 useLoading</div>
            </div>
          </div>
          
          <div style="text-align: center;">
            <button class="btn btn-primary" @click="handleAction" :disabled="loading">
              {{ loading ? message : '执行操作' }}
            </button>
            <button class="btn btn-default" @click="increment">增加计数</button>
          </div>
          
          <div class="log-output" style="margin-top: 15px; max-height: 100px;">
            <div v-for="(log, index) in logs.slice(0, 5)" :key="index" class="log-entry">
              [{{ log.time }}] {{ log.message }}
            </div>
          </div>
          
          <div class="type-hint" style="margin-top: 15px;">
            这个组件同时使用了 useCounter、useLoading 和 useLogger，没有命名冲突，来源清晰
          </div>
        </div>
      `,
      setup() {
        // 同时组合多个 Composables
        const { count, increment } = useCounter(0);
        const { loading, message, withLoading } = useLoading();
        const { logs, info } = useLogger('CombinedDemo');
        
        const handleAction = async () => {
          info('开始执行操作');
          await withLoading(async () => {
            await new Promise(resolve => setTimeout(resolve, 1000));
            increment();
            info('操作完成，计数已增加');
          }, '处理中...');
        };
        
        return {
          count,
          increment,
          loading,
          message,
          logs,
          handleAction
        };
      }
    });

    // 创建应用
    createApp({
      components: {
        TypedCounterComposable,
        TypedLoadingComposable,
        TypedLoggerComposable,
        TypedCombinedComposables
      }
    }).mount('#app');
  </script>
</body>
</html>
