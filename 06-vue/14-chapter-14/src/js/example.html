<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第14章：生命周期钩子 - JavaScript示例</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; color: #333; margin-bottom: 30px; }
    h2 { color: #42b883; margin: 30px 0 15px; border-bottom: 2px solid #42b883; padding-bottom: 10px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    .card { background: white; border-radius: 8px; padding: 20px; margin: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 5px; transition: opacity 0.2s; }
    .btn-primary { background: #42b883; color: white; }
    .btn-danger { background: #ff5252; color: white; }
    .btn-default { background: #e0e0e0; color: #333; }
    .btn:hover { opacity: 0.8; }
    
    .logs { background: #1e1e1e; color: #4ec9b0; padding: 15px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 13px; max-height: 200px; overflow-y: auto; margin-top: 15px; }
    .log-entry { margin: 3px 0; }
    .log-time { color: #ce9178; }
    .log-mount { color: #4ec9b0; }
    .log-update { color: #dcdcaa; }
    .log-unmount { color: #f44747; }
    
    .counter { font-size: 48px; font-weight: bold; color: #42b883; text-align: center; padding: 20px; }
    .countdown { text-align: center; }
    .countdown-display { font-size: 64px; font-weight: bold; color: #ff5252; font-family: monospace; }
    .countdown-label { color: #666; margin-top: 10px; }
    
    .window-info { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .info-box { background: #f8f8f8; padding: 20px; border-radius: 4px; text-align: center; }
    .info-value { font-size: 32px; font-weight: bold; color: #42b883; }
    .info-label { color: #666; margin-top: 5px; font-size: 14px; }
    
    .user-list { list-style: none; }
    .user-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
    .user-item:last-child { border-bottom: none; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #42b883; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin-right: 15px; }
    .user-info { flex: 1; }
    .user-name { font-weight: 500; color: #333; }
    .user-email { font-size: 13px; color: #666; }
    
    .loading { text-align: center; padding: 40px; color: #666; }
    .error { background: #ffebee; color: #c62828; padding: 15px; border-radius: 4px; margin: 10px 0; }
    
    .component-wrapper { border: 2px dashed #42b883; padding: 20px; border-radius: 8px; margin: 15px 0; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; margin-left: 10px; }
    .status-mounted { background: #e8f5e9; color: #2e7d32; }
    .status-updating { background: #fff3e0; color: #ef6c00; }
    .status-unmounted { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>Vue 3 生命周期钩子示例</h1>
      
      <h2>1. 生命周期演示</h2>
      
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h3>LifecycleDemo 组件</h3>
          <button class="btn btn-danger" @click="showDemo = !showDemo">
            {{ showDemo ? '销毁组件' : '创建组件' }}
          </button>
        </div>
        
        <div v-if="showDemo" class="component-wrapper">
          <lifecycle-demo ref="demoRef" />
        </div>
        <div v-else style="text-align: center; color: #999; padding: 40px;">
          组件已销毁
        </div>
      </div>
      
      <h2>2. 自动计数器</h2>
      
      <div class="card">
        <auto-counter v-if="showCounter" />
        <div v-else class="loading">计数器已停止</div>
        <div style="text-align: center; margin-top: 15px;">
          <button class="btn btn-primary" @click="showCounter = !showCounter">
            {{ showCounter ? '停止' : '启动' }} 计数器
          </button>
        </div>
      </div>
      
      <h2>3. 倒计时组件</h2>
      
      <div class="card">
        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
          <div style="flex: 1;">
            <h4>60秒倒计时</h4>
            <countdown-timer :seconds="60" @finish="onCountdownFinish('60秒')" />
          </div>
          <div style="flex: 1;">
            <h4>10秒倒计时</h4>
            <countdown-timer :seconds="10" @finish="onCountdownFinish('10秒')" />
          </div>
        </div>
      </div>
      
      <h2>4. 窗口大小监听</h2>
      
      <div class="card">
        <window-monitor />
      </div>
      
      <h2>5. 数据获取示例</h2>
      
      <div class="card">
        <user-list />
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, onBeforeMount, onMounted, onBeforeUpdate, onUpdated, onBeforeUnmount, onUnmounted } = Vue;

    // 1. 生命周期演示组件
    const LifecycleDemo = {
      template: `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div>
              <span>状态: </span>
              <span class="status-badge" :class="statusClass">{{ status }}</span>
            </div>
            <button class="btn btn-primary" @click="count++">触发更新 ({{ count }})</button>
          </div>
          <div class="logs">
            <div v-for="(log, index) in logs" :key="index" class="log-entry">
              <span class="log-time">[{{ log.time }}]</span>
              <span :class="'log-' + log.type"> {{ log.message }}</span>
            </div>
            <div v-if="logs.length === 0" style="color: #666; font-style: italic;">等待生命周期事件...</div>
          </div>
        </div>
      `,
      setup() {
        const logs = ref([]);
        const count = ref(0);
        const status = ref('已挂载');
        const statusClass = ref('status-mounted');

        function addLog(type, message) {
          const time = new Date().toLocaleTimeString();
          logs.value.unshift({ time, type, message });
          if (logs.value.length > 20) logs.value.pop();
        }

        // 记录 setup 执行
        addLog('mount', 'setup() 执行 - 组件实例创建');

        onBeforeMount(() => {
          addLog('mount', 'onBeforeMount - 即将挂载到 DOM');
        });

        onMounted(() => {
          addLog('mount', 'onMounted - 已挂载到 DOM，可以操作 DOM');
          status.value = '运行中';
        });

        onBeforeUpdate(() => {
          addLog('update', 'onBeforeUpdate - 数据变化，即将更新 DOM');
          status.value = '更新中';
          statusClass.value = 'status-updating';
        });

        onUpdated(() => {
          addLog('update', 'onUpdated - DOM 已更新完成');
          status.value = '运行中';
          statusClass.value = 'status-mounted';
        });

        onBeforeUnmount(() => {
          addLog('unmount', 'onBeforeUnmount - 组件即将卸载');
          status.value = '卸载中';
          statusClass.value = 'status-unmounted';
        });

        onUnmounted(() => {
          console.log('组件已从 DOM 中移除');
        });

        return { logs, count, status, statusClass };
      }
    };

    // 2. 自动计数器
    const AutoCounter = {
      template: `
        <div class="counter">
          {{ count }}
          <div style="font-size: 14px; color: #666; font-weight: normal; margin-top: 10px;">
            每秒自动 +1
          </div>
        </div>
      `,
      setup() {
        const count = ref(0);
        let timer = null;

        onMounted(() => {
          console.log('计数器挂载，启动定时器');
          timer = setInterval(() => {
            count.value++;
          }, 1000);
        });

        onUnmounted(() => {
          console.log('计数器卸载，清理定时器');
          clearInterval(timer);
        });

        return { count };
      }
    };

    // 3. 倒计时组件
    const CountdownTimer = {
      props: ['seconds'],
      emits: ['finish'],
      template: `
        <div class="countdown">
          <div class="countdown-display">{{ formattedTime }}</div>
          <div class="countdown-label">
            {{ isRunning ? '倒计时进行中...' : '倒计时结束' }}
          </div>
          <button 
            v-if="!isRunning" 
            class="btn btn-primary" 
            style="margin-top: 15px;"
            @click="restart"
          >
            重新开始
          </button>
        </div>
      `,
      setup(props, { emit }) {
        const remaining = ref(props.seconds);
        const isRunning = ref(true);
        let timer = null;

        const formattedTime = computed(() => {
          const mins = Math.floor(remaining.value / 60);
          const secs = remaining.value % 60;
          return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        });

        function start() {
          isRunning.value = true;
          timer = setInterval(() => {
            if (remaining.value > 0) {
              remaining.value--;
            } else {
              stop();
              emit('finish');
            }
          }, 1000);
        }

        function stop() {
          isRunning.value = false;
          clearInterval(timer);
        }

        function restart() {
          remaining.value = props.seconds;
          start();
        }

        onMounted(() => {
          start();
        });

        onUnmounted(() => {
          clearInterval(timer);
        });

        return { remaining, isRunning, formattedTime, restart };
      }
    };

    // 计算属性模拟
    const computed = (getter) => {
      const value = ref(getter());
      return {
        get value() { return getter(); }
      };
    };

    // 4. 窗口大小监听
    const WindowMonitor = {
      template: `
        <div class="window-info">
          <div class="info-box">
            <div class="info-value">{{ width }}px</div>
            <div class="info-label">窗口宽度</div>
          </div>
          <div class="info-box">
            <div class="info-value">{{ height }}px</div>
            <div class="info-label">窗口高度</div>
          </div>
          <div class="info-box" style="grid-column: 1 / -1;">
            <div style="font-size: 14px; color: #666;">
              尝试改变浏览器窗口大小，数值会实时更新（带100ms防抖）
            </div>
          </div>
        </div>
      `,
      setup() {
        const width = ref(window.innerWidth);
        const height = ref(window.innerHeight);
        let resizeTimer = null;

        function handleResize() {
          // 防抖处理
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            width.value = window.innerWidth;
            height.value = window.innerHeight;
          }, 100);
        }

        onMounted(() => {
          window.addEventListener('resize', handleResize);
        });

        onUnmounted(() => {
          window.removeEventListener('resize', handleResize);
          clearTimeout(resizeTimer);
        });

        return { width, height };
      }
    };

    // 5. 用户列表组件（模拟 API 请求）
    const UserList = {
      template: `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>用户列表</h3>
            <button class="btn btn-primary" @click="fetchUsers" :disabled="loading">
              {{ loading ? '加载中...' : '刷新' }}
            </button>
          </div>
          
          <div v-if="loading" class="loading">
            <div>正在获取用户数据...</div>
            <div style="font-size: 12px; color: #999; margin-top: 10px;">onMounted 中发送请求</div>
          </div>
          
          <div v-else-if="error" class="error">
            <strong>加载失败:</strong> {{ error }}
          </div>
          
          <ul v-else class="user-list">
            <li v-for="user in users" :key="user.id" class="user-item">
              <div class="user-avatar">{{ user.name[0] }}</div>
              <div class="user-info">
                <div class="user-name">{{ user.name }}</div>
                <div class="user-email">{{ user.email }}</div>
              </div>
            </li>
          </ul>
        </div>
      `,
      setup() {
        const users = ref([]);
        const loading = ref(false);
        const error = ref(null);

        async function fetchUsers() {
          loading.value = true;
          error.value = null;

          try {
            // 模拟 API 请求延迟
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // 模拟数据
            users.value = [
              { id: 1, name: '张三', email: 'zhangsan@example.com' },
              { id: 2, name: '李四', email: 'lisi@example.com' },
              { id: 3, name: '王五', email: 'wangwu@example.com' },
              { id: 4, name: '赵六', email: 'zhaoliu@example.com' }
            ];
          } catch (e) {
            error.value = '获取用户数据失败，请重试';
          } finally {
            loading.value = false;
          }
        }

        onMounted(() => {
          fetchUsers();
        });

        return { users, loading, error, fetchUsers };
      }
    };

    // 创建应用
    createApp({
      components: {
        LifecycleDemo,
        AutoCounter,
        CountdownTimer,
        WindowMonitor,
        UserList
      },
      setup() {
        const showDemo = ref(true);
        const showCounter = ref(true);

        const onCountdownFinish = (name) => {
          alert(`${name}倒计时结束！`);
        };

        return {
          showDemo,
          showCounter,
          onCountdownFinish
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
