<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第13章：插槽 - TypeScript示例</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/typescript@latest/lib/typescript.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; color: #333; margin-bottom: 30px; }
    h2 { color: #42b883; margin: 30px 0 15px; border-bottom: 2px solid #42b883; padding-bottom: 10px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    .card { background: white; border-radius: 8px; padding: 20px; margin: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card-header { border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
    .card-footer { border-top: 2px solid #eee; padding-top: 15px; margin-top: 15px; color: #666; }
    
    .list { list-style: none; padding: 0; }
    .list-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
    .list-item:last-child { border-bottom: none; }
    .index { color: #999; font-weight: bold; min-width: 30px; }
    .name { flex: 1; }
    .role { padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .role.admin { background: #42b883; color: white; }
    .role.user { background: #e0e0e0; color: #666; }
    
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: white; border-radius: 8px; min-width: 400px; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .modal-header { padding: 20px; border-bottom: 1px solid #eee; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 20px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 10px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button.primary { background: #42b883; color: white; }
    button.default { background: #e0e0e0; color: #333; }
    button:hover { opacity: 0.9; }
    
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8f8f8; font-weight: bold; color: #666; }
    tr:hover { background: #f8f8f8; }
    .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .tag.active { background: #42b883; color: white; }
    .tag.inactive { background: #ff5252; color: white; }
    
    .comment { display: flex; gap: 15px; padding: 15px; border-bottom: 1px solid #eee; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #42b883; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; }
    .comment-content { flex: 1; }
    .comment-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .author { font-weight: bold; color: #333; }
    .time { color: #999; font-size: 12px; }
    .comment-text { color: #666; line-height: 1.6; }
    .actions { display: flex; gap: 15px; margin-top: 10px; }
    .action { color: #42b883; cursor: pointer; font-size: 13px; }
    .action:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>Vue 3 + TypeScript 插槽示例</h1>
      
      <h2>1. 类型化的基础插槽</h2>
      
      <card>
        <template #header>
          <h3 style="color: #42b883;">TypeScript + Vue 插槽</h3>
        </template>
        <p>使用 TypeScript 可以让插槽的 props 拥有完整的类型支持。</p>
        <template #footer>
          <button class="primary" @click="showTypeInfo">查看类型定义</button>
        </template>
      </card>
      
      <h2>2. 类型化的作用域插槽</h2>
      
      <typed-list :items="typedUsers" #default="{ item, index }">
        <span class="index">{{ index + 1 }}</span>
        <span class="name">{{ item.name }}</span>
        <span class="role" :class="item.role">{{ item.role.toUpperCase() }}</span>
        <span style="color: #999;">({{ item.age }}岁)</span>
      </typed-list>
      
      <h2>3. 类型安全的表格组件</h2>
      
      <typed-table :columns="typedColumns" :data="typedData">
        <template #name="{ value, row }">
          <strong style="color: #42b883;">{{ value }}</strong>
          <small style="color: #999;">(ID: {{ row.id }})</small>
        </template>
        <template #department="{ value }">
          <span class="tag active">{{ value }}</span>
        </template>
        <template #salary="{ value }">
          <span style="color: #42b883; font-weight: bold;">¥{{ value.toLocaleString() }}</span>
        </template>
      </typed-table>
    </div>
  </div>

  <script>
    // TypeScript 类型定义（运行时模拟）
    /**
     * @typedef {Object} User
     * @property {number} id
     * @property {string} name
     * @property {'admin'|'user'|'guest'} role
     * @property {number} age
     */

    /**
     * @typedef {Object} Employee
     * @property {number} id
     * @property {string} name
     * @property {string} department
     * @property {number} salary
     */

    /**
     * @typedef {Object} Column
     * @property {string} key
     * @property {string} title
     */

    const { createApp, ref, defineComponent } = Vue;

    // Card 组件 - 基础插槽
    const Card = defineComponent({
      template: `
        <div class="card">
          <div class="card-header">
            <slot name="header">
              <h3>默认标题</h3>
            </slot>
          </div>
          <div class="card-body">
            <slot>
              <p>暂无内容</p>
            </slot>
          </div>
          <div class="card-footer">
            <slot name="footer">
              <small>默认页脚</small>
            </slot>
          </div>
        </div>
      `
    });

    // TypedList 组件 - 带类型的作用域插槽
    const TypedList = defineComponent({
      props: {
        items: {
          type: Array,
          required: true
          // 在 TS 中: items: User[]
        }
      },
      template: `
        <ul class="list">
          <li v-for="(item, index) in items" :key="item.id" class="list-item">
            <slot :item="item" :index="index">
              {{ item.name }}
            </slot>
          </li>
        </ul>
      `
    });

    // TypedTable 组件 - 带类型的表格
    const TypedTable = defineComponent({
      props: {
        columns: {
          type: Array,
          required: true
          // 在 TS 中: columns: Column[]
        },
        data: {
          type: Array,
          required: true
          // 在 TS 中: data: Employee[]
        }
      },
      template: `
        <table>
          <thead>
            <tr>
              <th v-for="col in columns" :key="col.key">{{ col.title }}</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="row in data" :key="row.id">
              <td v-for="col in columns" :key="col.key">
                <slot :name="col.key" :value="row[col.key]" :row="row" :column="col">
                  {{ row[col.key] }}
                </slot>
              </td>
            </tr>
          </tbody>
        </table>
      `
    });

    // 创建应用
    createApp({
      components: {
        Card,
        TypedList,
        TypedTable
      },
      setup() {
        // 带类型的用户数据
        /** @type {import('vue').Ref<User[]>} */
        const typedUsers = ref([
          { id: 1, name: '张三', role: 'admin', age: 30 },
          { id: 2, name: '李四', role: 'user', age: 25 },
          { id: 3, name: '王五', role: 'user', age: 28 }
        ]);

        // 表格列定义
        /** @type {Column[]} */
        const typedColumns = ref([
          { key: 'id', title: 'ID' },
          { key: 'name', title: '姓名' },
          { key: 'department', title: '部门' },
          { key: 'salary', title: '薪资' }
        ]);

        // 员工数据
        /** @type {import('vue').Ref<Employee[]>} */
        const typedData = ref([
          { id: 1, name: '张三', department: '技术部', salary: 25000 },
          { id: 2, name: '李四', department: '产品部', salary: 20000 },
          { id: 3, name: '王五', department: '设计部', salary: 18000 }
        ]);

        const showTypeInfo = () => {
          const info = `
类型定义示例：

interface User {
  id: number
  name: string
  role: 'admin' | 'user' | 'guest'
  age: number
}

interface Column {
  key: string
  title: string
}

// 使用 defineProps 进行类型标注
const props = defineProps<{
  items: User[]
  columns: Column[]
}>()
          `;
          alert(info);
        };

        return {
          typedUsers,
          typedColumns,
          typedData,
          showTypeInfo
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
