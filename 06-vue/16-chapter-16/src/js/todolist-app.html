<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项列表 - JS 版本</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .app-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 10px;
      font-size: 32px;
    }
    
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }
    
    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    input[type="text"] {
      flex: 1;
      padding: 15px 20px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.3s;
    }
    
    input[type="text"]:focus {
      border-color: #667eea;
    }
    
    .btn-add {
      padding: 15px 30px;
      font-size: 16px;
      background: #42b883;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      white-space: nowrap;
    }
    
    .btn-add:hover {
      background: #369870;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(66, 184, 131, 0.4);
    }
    
    .filter-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    
    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .filter-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }
    
    .filter-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    
    .todo-list {
      list-style: none;
    }
    
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    
    .todo-item:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    
    .todo-item.completed {
      opacity: 0.6;
    }
    
    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #6c757d;
    }
    
    .todo-checkbox {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: #42b883;
    }
    
    .todo-text {
      flex: 1;
      font-size: 16px;
      color: #333;
    }
    
    .btn-delete {
      padding: 8px 16px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .btn-delete:hover {
      background: #ee5a5a;
      transform: scale(1.05);
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    
    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    .stats-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid #e0e0e0;
    }
    
    .stat-card {
      text-align: center;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 12px;
    }
    
    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #667eea;
    }
    
    .stat-label {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    
    .clear-completed {
      text-align: center;
      margin-top: 20px;
    }
    
    .btn-clear {
      padding: 10px 20px;
      background: transparent;
      color: #ff6b6b;
      border: 2px solid #ff6b6b;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .btn-clear:hover {
      background: #ff6b6b;
      color: white;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <div class="app-card">
        <h1>📝 待办事项列表</h1>
        <p class="subtitle">JavaScript 版本</p>
        
        <!-- 输入区域 -->
        <div class="input-section">
          <input 
            type="text" 
            v-model="newTodo"
            @keyup.enter="addTodo"
            placeholder="添加新的待办事项..."
          >
          <button class="btn-add" @click="addTodo">
            ➕ 添加
          </button>
        </div>
        
        <!-- 筛选按钮 -->
        <div class="filter-section">
          <button 
            class="filter-btn"
            :class="{ active: filter === 'all' }"
            @click="filter = 'all'"
          >
            全部 ({{ totalCount }})
          </button>
          <button 
            class="filter-btn"
            :class="{ active: filter === 'active' }"
            @click="filter = 'active'"
          >
            待完成 ({{ pendingCount }})
          </button>
          <button 
            class="filter-btn"
            :class="{ active: filter === 'completed' }"
            @click="filter = 'completed'"
          >
            已完成 ({{ completedCount }})
          </button>
        </div>
        
        <!-- 待办列表 -->
        <ul class="todo-list" v-if="filteredTodos.length > 0">
          <li 
            v-for="todo in filteredTodos" 
            :key="todo.id"
            class="todo-item"
            :class="{ completed: todo.completed }"
          >
            <input 
              type="checkbox" 
              class="todo-checkbox"
              v-model="todo.completed"
            >
            <span class="todo-text">{{ todo.text }}</span>
            <button class="btn-delete" @click="removeTodo(todo.id)">
              删除
            </button>
          </li>
        </ul>
        
        <!-- 空状态 -->
        <div class="empty-state" v-else>
          <div class="empty-state-icon">📭</div>
          <p v-if="filter === 'all'">还没有待办事项，添加一个吧！</p>
          <p v-else-if="filter === 'active'">没有待完成的事项，真棒！</p>
          <p v-else>没有已完成的事项</p>
        </div>
        
        <!-- 统计信息 -->
        <div class="stats-section">
          <div class="stat-card">
            <div class="stat-value">{{ totalCount }}</div>
            <div class="stat-label">总事项</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">{{ completedCount }}</div>
            <div class="stat-label">已完成</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">{{ pendingCount }}</div>
            <div class="stat-label">待完成</div>
          </div>
        </div>
        
        <!-- 清除已完成按钮 -->
        <div class="clear-completed" v-if="completedCount > 0">
          <button class="btn-clear" @click="clearCompleted">
            🗑️ 清除已完成 ({{ completedCount }})
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, watch } = Vue

    createApp({
      setup() {
        // ========== 响应式数据 ==========
        const newTodo = ref('')
        const todos = ref([
          { id: 1, text: '学习 Vue 3 基础', completed: true },
          { id: 2, text: '创建一个 Todo 应用', completed: false },
          { id: 3, text: '学习本地存储', completed: false }
        ])
        const filter = ref('all')
        const nextId = ref(4)

        // ========== 计算属性 ==========
        // 根据筛选条件过滤待办事项
        const filteredTodos = computed(() => {
          switch (filter.value) {
            case 'active':
              return todos.value.filter(todo => !todo.completed)
            case 'completed':
              return todos.value.filter(todo => todo.completed)
            default:
              return todos.value
          }
        })

        // 统计总数
        const totalCount = computed(() => todos.value.length)
        
        // 统计已完成数
        const completedCount = computed(() => 
          todos.value.filter(todo => todo.completed).length
        )
        
        // 统计待完成数
        const pendingCount = computed(() => 
          todos.value.filter(todo => !todo.completed).length
        )

        // ========== 方法 ==========
        // 添加待办事项
        const addTodo = () => {
          const text = newTodo.value.trim()
          if (!text) return
          
          todos.value.push({
            id: nextId.value++,
            text: text,
            completed: false
          })
          
          newTodo.value = ''
        }

        // 删除待办事项
        const removeTodo = (id) => {
          const index = todos.value.findIndex(todo => todo.id === id)
          if (index > -1) {
            todos.value.splice(index, 1)
          }
        }

        // 清除已完成事项
        const clearCompleted = () => {
          todos.value = todos.value.filter(todo => !todo.completed)
        }

        // ========== 本地存储 ==========
        // 监听 todos 变化，保存到 localStorage
        watch(todos, (newTodos) => {
          localStorage.setItem('todos', JSON.stringify(newTodos))
        }, { deep: true })

        // 页面加载时从 localStorage 读取数据
        const savedTodos = localStorage.getItem('todos')
        if (savedTodos) {
          try {
            todos.value = JSON.parse(savedTodos)
            // 更新 nextId 避免重复
            const maxId = Math.max(...todos.value.map(t => t.id), 0)
            nextId.value = maxId + 1
          } catch (e) {
            console.error('Failed to parse todos from localStorage:', e)
          }
        }

        return {
          newTodo,
          todos,
          filter,
          filteredTodos,
          totalCount,
          completedCount,
          pendingCount,
          addTodo,
          removeTodo,
          clearCompleted
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
