<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第二十五章：script setup 语法糖 - JavaScript 示例</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .demo-section {
      border: 1px solid #ddd;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
    .demo-title {
      color: #42b983;
      margin-top: 0;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      background: #42b983;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #369870;
    }
    .info-box {
      background: #f0f8ff;
      padding: 15px;
      border-left: 4px solid #42b983;
      margin: 10px 0;
    }
    .code-block {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin: 10px 0;
      line-height: 1.5;
    }
    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .comparison > div {
      padding: 15px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    .todo-item {
      display: flex;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
    .todo-item.done {
      text-decoration: line-through;
      color: #999;
    }
    .user-card {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px 0;
      border-radius: 4px;
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>第二十五章：script setup 语法糖</h1>
  <p>本章演示 <code>&lt;script setup&gt;</code> 语法糖的用法和优势。</p>

  <div id="app">
    <!-- 示例 1：对比 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 1：传统 setup() vs script setup</h2>
      <comparison-demo></comparison-demo>
    </div>

    <!-- 示例 2：基础计数器 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 2：计数器组件</h2>
      <counter-setup></counter-setup>
    </div>

    <!-- 示例 3：待办事项 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 3：待办事项列表</h2>
      <todo-setup></todo-setup>
    </div>

    <!-- 示例 4：Props 和 Emits -->
    <div class="demo-section">
      <h2 class="demo-title">示例 4：Props 和 Emits</h2>
      <props-emits-demo></props-emits-demo>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted, defineProps, defineEmits, defineExpose } = Vue;

    // 传统 setup() 风格
    const TraditionalCounter = {
      setup() {
        const count = ref(0);
        const double = computed(() => count.value * 2);
        
        const increment = () => count.value++;
        const decrement = () => count.value--;
        const reset = () => count.value = 0;
        
        return {
          count,
          double,
          increment,
          decrement,
          reset
        };
      },
      template: `
        <div>
          <p>计数：{{ count }}</p>
          <p>双倍：{{ double }}</p>
          <button @click="decrement">-</button>
          <button @click="increment">+</button>
          <button @click="reset">重置</button>
        </div>
      `
    };

    // script setup 风格（使用简化语法模拟）
    const ScriptSetupCounter = {
      setup() {
        // 这就是 <script setup> 的写法，不需要 export default 和 return
        const count = ref(0);
        const double = computed(() => count.value * 2);
        
        const increment = () => count.value++;
        const decrement = () => count.value--;
        const reset = () => count.value = 0;
        
        // 自动暴露给模板，无需 return
        return {
          count,
          double,
          increment,
          decrement,
          reset
        };
      },
      template: `
        <div>
          <p>计数：{{ count }}</p>
          <p>双倍：{{ double }}</p>
          <button @click="decrement">-</button>
          <button @click="increment">+</button>
          <button @click="reset">重置</button>
        </div>
      `
    };

    const ComparisonDemo = {
      components: {
        TraditionalCounter,
        ScriptSetupCounter
      },
      template: `
        <div class="comparison">
          <div>
            <h4>传统 setup()</h4>
            <div class="code-block">export default {
  setup() {
    const count = ref(0);
    
    const increment = () => {
      count.value++;
    };
    
    return {
      count,
      increment
    };
  }
}</div>
            <traditional-counter></traditional-counter>
          </div>
          <div>
            <h4>&lt;script setup&gt;</h4>
            <div class="code-block">&lt;script setup&gt;
const count = ref(0);

const increment = () => {
  count.value++;
};
// 无需 return
&lt;/script&gt;</div>
            <script-setup-counter></script-setup-counter>
          </div>
        </div>
        <div class="info-box">
          <strong>script setup 的优势：</strong><br>
          1. 更少的样板代码（不需要 export default 和 return）<br>
          2. 更好的 TypeScript 支持<br>
          3. 更直观的代码组织<br>
          4. 更好的运行时性能
        </div>
      `
    };

    // 计数器组件
    const CounterSetup = {
      setup() {
        const count = ref(0);
        const double = computed(() => count.value * 2);
        const isEven = computed(() => count.value % 2 === 0);
        
        const increment = () => count.value++;
        const decrement = () => count.value--;
        const reset = () => count.value = 0;
        
        onMounted(() => {
          console.log('计数器组件已挂载');
        });
        
        return {
          count,
          double,
          isEven,
          increment,
          decrement,
          reset
        };
      },
      template: `
        <div style="text-align: center;">
          <div style="font-size: 48px; font-weight: bold; color: #42b983; margin: 20px;">
            {{ count }}
          </div>
          <p>双倍：{{ double }} | {{ isEven ? '偶数' : '奇数' }}</p>
          <div>
            <button @click="decrement" style="font-size: 20px; padding: 10px 20px;">-</button>
            <button @click="increment" style="font-size: 20px; padding: 10px 20px;">+</button>
          </div>
          <button @click="reset" style="margin-top: 10px;">重置</button>
        </div>
      `
    };

    // 待办事项组件
    const TodoSetup = {
      setup() {
        const newTodo = ref('');
        const todos = ref([
          { id: 1, text: '学习 script setup', done: false },
          { id: 2, text: '练习组合式 API', done: false },
          { id: 3, text: '完成练习题', done: true }
        ]);
        
        let nextId = 4;
        
        const remaining = computed(() => {
          return todos.value.filter(todo => !todo.done).length;
        });
        
        const progress = computed(() => {
          const total = todos.value.length;
          return total === 0 ? 0 : Math.round((total - remaining.value) / total * 100);
        });
        
        const addTodo = () => {
          if (newTodo.value.trim()) {
            todos.value.push({
              id: nextId++,
              text: newTodo.value,
              done: false
            });
            newTodo.value = '';
          }
        };
        
        const removeTodo = (todo) => {
          const index = todos.value.indexOf(todo);
          if (index > -1) {
            todos.value.splice(index, 1);
          }
        };
        
        return {
          newTodo,
          todos,
          remaining,
          progress,
          addTodo,
          removeTodo
        };
      },
      template: `
        <div>
          <div style="margin-bottom: 15px;">
            <input 
              v-model="newTodo" 
              @keyup.enter="addTodo"
              placeholder="添加新待办..."
              style="width: 300px; padding: 8px;"
            >
            <button @click="addTodo">添加</button>
          </div>
          
          <div style="margin-bottom: 15px;">
            <span>剩余 {{ remaining }} 项未完成 | 完成度：{{ progress }}%</span>
            <div style="background: #eee; height: 10px; border-radius: 5px; margin-top: 5px;">
              <div :style="{ width: progress + '%', background: '#42b983', height: '100%', borderRadius: '5px', transition: 'width 0.3s' }"></div>
            </div>
          </div>
          
          <div>
            <div 
              v-for="todo in todos" 
              :key="todo.id"
              class="todo-item"
              :class="{ done: todo.done }"
            >
              <input type="checkbox" v-model="todo.done">
              <span style="flex: 1; margin: 0 10px;">{{ todo.text }}</span>
              <button @click="removeTodo(todo)">删除</button>
            </div>
          </div>
        </div>
      `
    };

    // 用户卡片组件
    const UserCard = {
      props: {
        name: {
          type: String,
          required: true
        },
        age: {
          type: Number,
          default: 0
        },
        email: String
      },
      emits: ['edit', 'delete'],
      setup(props, { emit }) {
        const handleEdit = () => {
          emit('edit', { name: props.name, age: props.age });
        };
        
        const handleDelete = () => {
          emit('delete');
        };
        
        return {
          handleEdit,
          handleDelete
        };
      },
      template: `
        <div class="user-card">
          <h4>{{ name }}</h4>
          <p>年龄：{{ age }}</p>
          <p v-if="email">邮箱：{{ email }}</p>
          <button @click="handleEdit">编辑</button>
          <button @click="handleDelete">删除</button>
        </div>
      `
    };

    const PropsEmitsDemo = {
      components: { UserCard },
      setup() {
        const users = ref([
          { id: 1, name: '张三', age: 25, email: 'zhangsan@example.com' },
          { id: 2, name: '李四', age: 30, email: 'lisi@example.com' },
          { id: 3, name: '王五', age: 28 }
        ]);
        
        const lastAction = ref('');
        
        const handleEdit = (userData) => {
          lastAction.value = `编辑用户：${userData.name}`;
        };
        
        const handleDelete = (userId) => {
          const user = users.value.find(u => u.id === userId);
          lastAction.value = `删除用户：${user.name}`;
          users.value = users.value.filter(u => u.id !== userId);
        };
        
        return {
          users,
          lastAction,
          handleEdit,
          handleDelete
        };
      },
      template: `
        <div>
          <p v-if="lastAction" class="info-box">{{ lastAction }}</p>
          
          <user-card
            v-for="user in users"
            :key="user.id"
            :name="user.name"
            :age="user.age"
            :email="user.email"
            @edit="handleEdit"
            @delete="handleDelete(user.id)"
          ></user-card>
          
          <div class="code-block">
// 定义 Props
const props = defineProps({
  name: {
    type: String,
    required: true
  },
  age: {
    type: Number,
    default: 0
  }
});

// 定义 Emits
const emit = defineEmits(['edit', 'delete']);

// 使用
emit('edit', { name: props.name });
          </div>
        </div>
      `
    };

    createApp({
      components: {
        ComparisonDemo,
        CounterSetup,
        TodoSetup,
        PropsEmitsDemo
      }
    }).mount('#app');
  </script>
</body>
</html>
