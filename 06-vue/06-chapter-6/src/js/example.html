<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第二十章：ref 与 reactive - JavaScript 示例</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .demo-section {
      border: 1px solid #ddd;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
    .demo-title {
      color: #42b983;
      margin-top: 0;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      background: #42b983;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #369870;
    }
    .info-box {
      background: #f0f8ff;
      padding: 15px;
      border-left: 4px solid #42b983;
      margin: 10px 0;
    }
    .warning-box {
      background: #fff3cd;
      padding: 15px;
      border-left: 4px solid #ffc107;
      margin: 10px 0;
    }
    .code-block {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>第二十章：ref 与 reactive</h1>
  <p>本章演示 ref 和 reactive 的用法、区别和最佳实践。</p>

  <div id="app">
    <!-- 示例 1：ref 基础 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 1：ref 基础用法</h2>
      <ref-basic-demo></ref-basic-demo>
    </div>

    <!-- 示例 2：reactive 基础 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 2：reactive 基础用法</h2>
      <reactive-basic-demo></reactive-basic-demo>
    </div>

    <!-- 示例 3：对比和选择 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 3：ref vs reactive 对比</h2>
      <comparison-demo></comparison-demo>
    </div>

    <!-- 示例 4：最佳实践 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 4：最佳实践</h2>
      <best-practice-demo></best-practice-demo>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, computed, toRefs } = Vue;

    // 示例 1：ref 基础
    const RefBasicDemo = {
      setup() {
        // 基本类型
        const count = ref(0);
        const message = ref('Hello Vue');
        const isActive = ref(true);
        
        // 对象
        const user = ref({
          name: '张三',
          age: 25,
          hobbies: ['读书', '游泳']
        });
        
        // 数组
        const items = ref(['苹果', '香蕉', '橙子']);
        
        const updateCount = () => {
          count.value++;
          console.log('count.value:', count.value);
        };
        
        const updateUser = () => {
          // 修改属性需要 .value
          user.value.age++;
          user.value.hobbies.push('编程');
        };
        
        const replaceUser = () => {
          // 可以替换整个对象
          user.value = {
            name: '李四',
            age: 30,
            hobbies: ['跑步', '音乐']
          };
        };
        
        return {
          count,
          message,
          isActive,
          user,
          items,
          updateCount,
          updateUser,
          replaceUser
        };
      },
      template: `
        <div>
          <h4>基本类型</h4>
          <p>计数：{{ count }} - 消息：{{ message }} - 激活：{{ isActive }}</p>
          <button @click="updateCount">计数 +1</button>
          
          <h4>对象</h4>
          <p>姓名：{{ user.name }}，年龄：{{ user.age }}</p>
          <p>爱好：{{ user.hobbies.join('、') }}</p>
          <button @click="updateUser">修改用户</button>
          <button @click="replaceUser">替换用户</button>
          
          <div class="code-block">
// ref 使用 .value 访问和修改
const count = ref(0);
count.value++;  // 修改
count.value;    // 读取

// 可以替换整个对象
user.value = { name: '李四' };
          </div>
        </div>
      `
    };

    // 示例 2：reactive 基础
    const ReactiveBasicDemo = {
      setup() {
        // 复杂对象
        const user = reactive({
          name: '张三',
          age: 25,
          address: {
            city: '北京',
            street: '长安街',
            zipCode: '100000'
          },
          tags: ['VIP', '老客户']
        });
        
        // 数组
        const todos = reactive([
          { id: 1, text: '学习 ref', done: true },
          { id: 2, text: '学习 reactive', done: false },
          { id: 3, text: '练习代码', done: false }
        ]);
        
        const updateUser = () => {
          // 直接访问和修改，不需要 .value
          user.age++;
          user.address.city = '上海';
          user.tags.push('会员');
        };
        
        const addTodo = () => {
          const id = todos.length + 1;
          todos.push({
            id,
            text: `新待办 ${id}`,
            done: false
          });
        };
        
        const toggleTodo = (todo) => {
          todo.done = !todo.done;
        };
        
        return {
          user,
          todos,
          updateUser,
          addTodo,
          toggleTodo
        };
      },
      template: `
        <div>
          <h4>复杂对象</h4>
          <p>{{ user.name }}，{{ user.age }}岁</p>
          <p>地址：{{ user.address.city }} {{ user.address.street }}</p>
          <p>标签：{{ user.tags.join('、') }}</p>
          <button @click="updateUser">更新信息</button>
          
          <h4>响应式数组</h4>
          <ul>
            <li v-for="todo in todos" :key="todo.id">
              <input type="checkbox" :checked="todo.done" @change="toggleTodo(todo)">
              <span :style="{ textDecoration: todo.done ? 'line-through' : 'none' }">
                {{ todo.text }}
              </span>
            </li>
          </ul>
          <button @click="addTodo">添加待办</button>
          
          <div class="code-block">
// reactive 直接访问，不需要 .value
const user = reactive({ name: '张三' });
user.name = '李四';  // 直接修改
user.name;           // 直接读取
          </div>
        </div>
      `
    };

    // 示例 3：对比
    const ComparisonDemo = {
      setup() {
        // 使用 ref
        const countRef = ref(0);
        const userRef = ref({ name: '张三', age: 25 });
        
        // 使用 reactive
        const userReactive = reactive({ name: '张三', age: 25 });
        
        // 错误示范：解构 reactive 会失去响应性
        let { name, age } = userReactive;  // 错误！
        
        // 正确示范：使用 toRefs
        const userRefs = toRefs(userReactive);
        
        return {
          countRef,
          userRef,
          userReactive,
          name,  // 不会响应
          age,   // 不会响应
          userName: userRefs.name,  // 会响应
          userAge: userRefs.age      // 会响应
        };
      },
      template: `
        <div>
          <h4>替换对象对比</h4>
          <p>ref 对象：{{ userRef.name }}</p>
          <button @click="userRef = { name: '李四', age: 30 }">替换 ref 对象（✓ 有效）</button>
          
          <p>reactive 对象：{{ userReactive.name }}</p>
          <button @click="userReactive = { name: '李四', age: 30 }">替换 reactive 对象（✗ 无效）</button>
          <button @click="Object.assign(userReactive, { name: '李四', age: 30 })">使用 Object.assign（✓ 有效）</button>
          
          <h4>解构对比</h4>
          <p>错误解构（不会响应）：{{ name }}</p>
          <p>正确解构（使用 toRefs）：{{ userName }}</p>
          
          <div class="warning-box">
            <strong>重要提醒：</strong><br>
            1. reactive 不能直接替换整个对象<br>
            2. 解构 reactive 会失去响应性<br>
            3. 使用 toRefs 可以保持解构后的响应性
          </div>
        </div>
      `
    };

    // 示例 4：最佳实践
    const BestPracticeDemo = {
      setup() {
        // 推荐：统一使用 ref
        const state = ref({
          user: {
            name: '张三',
            email: 'zhangsan@example.com'
          },
          loading: false,
          error: null
        });
        
        const count = ref(0);
        const message = ref('');
        
        // 复杂表单可以用 reactive
        const form = reactive({
          username: '',
          password: '',
          confirmPassword: ''
        });
        
        const updateUser = () => {
          state.value.user.name = '李四';
          state.value.loading = true;
        };
        
        const submitForm = () => {
          console.log('提交表单：', form);
        };
        
        return {
          state,
          count,
          message,
          form,
          updateUser,
          submitForm
        };
      },
      template: `
        <div>
          <h4>推荐做法：统一使用 ref</h4>
          <p>用户名：{{ state.user.name }}</p>
          <p>加载中：{{ state.loading }}</p>
          <button @click="updateUser">更新状态</button>
          
          <h4>表单数据使用 reactive</h4>
          <div>
            <input v-model="form.username" placeholder="用户名"><br>
            <input v-model="form.password" type="password" placeholder="密码"><br>
            <input v-model="form.confirmPassword" type="password" placeholder="确认密码">
          </div>
          <p>表单数据：{{ form }}</p>
          <button @click="submitForm">提交</button>
          
          <div class="info-box">
            <strong>最佳实践：</strong><br>
            1. 统一使用 ref，更加灵活和一致<br>
            2. 复杂表单对象可以使用 reactive<br>
            3. 需要解构时使用 toRefs
          </div>
        </div>
      `
    };

    createApp({
      components: {
        RefBasicDemo,
        ReactiveBasicDemo,
        ComparisonDemo,
        BestPracticeDemo
      }
    }).mount('#app');
  </script>
</body>
</html>
