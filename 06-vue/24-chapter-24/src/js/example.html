<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第二十四章：Teleport 与 Suspense - JavaScript 示例</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .demo-section {
      border: 1px solid #ddd;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
    .demo-title {
      color: #42b983;
      margin-top: 0;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      background: #42b983;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #369870;
    }
    .info-box {
      background: #f0f8ff;
      padding: 15px;
      border-left: 4px solid #42b983;
      margin: 10px 0;
    }
    /* Teleport 目标容器样式 */
    #modals-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
    }
    #notifications-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1001;
    }
    .notification {
      background: #42b983;
      color: white;
      padding: 15px 20px;
      margin: 10px 0;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    .loading-box {
      background: #f5f5f5;
      padding: 40px;
      text-align: center;
      border-radius: 8px;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #42b983;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .overflow-hidden {
      overflow: hidden;
      height: 200px;
      border: 2px solid #ff6b6b;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>第二十四章：Teleport 与 Suspense</h1>
  <p>本章演示 Teleport 传送门组件和 Suspense 异步组件处理。</p>

  <!-- Teleport 目标容器 -->
  <div id="modals-container"></div>
  <div id="notifications-container"></div>

  <div id="app">
    <!-- 示例 1：Teleport 基础 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 1：Teleport 模态框</h2>
      <teleport-modal-demo></teleport-modal-demo>
    </div>

    <!-- 示例 2：Teleport 通知系统 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 2：Teleport 通知系统</h2>
      <teleport-notification-demo></teleport-notification-demo>
    </div>

    <!-- 示例 3：Suspense 基础 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 3：Suspense 异步组件</h2>
      <suspense-demo></suspense-demo>
    </div>

    <!-- 示例 4：Teleport + Suspense 综合 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 4：Teleport + Suspense 综合应用</h2>
      <combined-demo></combined-demo>
    </div>
  </div>

  <script>
    const { createApp, ref, Teleport, Suspense, defineAsyncComponent } = Vue;

    // 示例 1：Teleport 模态框
    const Modal = {
      props: ['title'],
      emits: ['close'],
      template: `
        <div class="modal-overlay" @click.self="$emit('close')">
          <div class="modal-content">
            <h3>{{ title }}</h3>
            <slot></slot>
            <button @click="$emit('close')" style="margin-top: 20px;">关闭</button>
          </div>
        </div>
      `
    };

    const TeleportModalDemo = {
      components: { Modal },
      setup() {
        const showModal = ref(false);
        
        return { showModal };
      },
      template: `
        <div>
          <div class="overflow-hidden">
            <p>这个容器设置了 overflow: hidden，如果模态框在这里渲染会被裁剪。</p>
            <button @click="showModal = true">打开模态框</button>
            
            <!-- 传送到 body 下的 #modals-container -->
            <Teleport to="#modals-container">
              <modal 
                v-if="showModal" 
                title="Teleport 模态框"
                @close="showModal = false"
              >
                <p>这个模态框被传送到 body 下的 #modals-container</p>
                <p>所以不会被父容器的 overflow: hidden 影响</p>
              </modal>
            </Teleport>
          </div>
          <div class="info-box">
            <strong>说明：</strong>打开模态框后检查元素，可以看到它被渲染在 body 下的 #modals-container 中，
            而不是在 overflow-hidden 容器内。
          </div>
        </div>
      `
    };

    // 示例 2：Teleport 通知系统
    const TeleportNotificationDemo = {
      setup() {
        const notifications = ref([]);
        let idCounter = 0;
        
        const addNotification = (type = 'info') => {
          const id = ++idCounter;
          const messages = {
            info: '这是一条信息通知',
            success: '操作成功！',
            warning: '请注意警告信息',
            error: '发生错误！'
          };
          
          notifications.value.push({
            id,
            message: messages[type],
            type
          });
          
          // 3秒后自动移除
          setTimeout(() => {
            removeNotification(id);
          }, 3000);
        };
        
        const removeNotification = (id) => {
          notifications.value = notifications.value.filter(n => n.id !== id);
        };
        
        return {
          notifications,
          addNotification,
          removeNotification
        };
      },
      template: `
        <div>
          <button @click="addNotification('info')">信息通知</button>
          <button @click="addNotification('success')">成功通知</button>
          <button @click="addNotification('warning')">警告通知</button>
          <button @click="addNotification('error')">错误通知</button>
          
          <!-- 所有通知传送到固定位置 -->
          <Teleport to="#notifications-container">
            <div 
              v-for="notification in notifications" 
              :key="notification.id"
              class="notification"
              @click="removeNotification(notification.id)"
            >
              {{ notification.message }}
            </div>
          </Teleport>
          
          <div class="info-box" style="margin-top: 20px;">
            <strong>说明：</strong>通知会自动显示在右上角，3秒后自动消失，点击也可以关闭。
          </div>
        </div>
      `
    };

    // 示例 3：Suspense 异步组件
    const AsyncUserList = {
      async setup() {
        const users = ref([]);
        
        // 模拟异步数据获取
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        users.value = [
          { id: 1, name: '张三', email: 'zhangsan@example.com' },
          { id: 2, name: '李四', email: 'lisi@example.com' },
          { id: 3, name: '王五', email: 'wangwu@example.com' },
        ];
        
        return { users };
      },
      template: `
        <div>
          <h3>用户列表</h3>
          <ul>
            <li v-for="user in users" :key="user.id">
              {{ user.name }} - {{ user.email }}
            </li>
          </ul>
        </div>
      `
    };

    const SuspenseDemo = {
      components: { Suspense },
      setup() {
        const showComponent = ref(false);
        
        return { showComponent };
      },
      template: `
        <div>
          <button @click="showComponent = !showComponent">
            {{ showComponent ? '卸载' : '加载' }}组件
          </button>
          
          <Suspense v-if="showComponent">
            <template #default>
              <async-user-list />
            </template>
            <template #fallback>
              <div class="loading-box">
                <div class="spinner"></div>
                <p>正在加载用户数据...</p>
              </div>
            </template>
          </Suspense>
        </div>
      `
    };

    // 示例 4：综合应用
    const AsyncDashboard = {
      async setup() {
        const stats = ref({});
        
        // 模拟异步加载仪表板数据
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        stats.value = {
          users: 1234,
          orders: 567,
          revenue: 89000
        };
        
        return { stats };
      },
      template: `
        <div>
          <h3>仪表板</h3>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 20px 0;">
            <div style="background: #42b983; color: white; padding: 20px; border-radius: 8px;">
              <h4>用户</h4>
              <p style="font-size: 24px; margin: 0;">{{ stats.users }}</p>
            </div>
            <div style="background: #409eff; color: white; padding: 20px; border-radius: 8px;">
              <h4>订单</h4>
              <p style="font-size: 24px; margin: 0;">{{ stats.orders }}</p>
            </div>
            <div style="background: #e6a23c; color: white; padding: 20px; border-radius: 8px;">
              <h4>收入</h4>
              <p style="font-size: 24px; margin: 0;">¥{{ stats.revenue }}</p>
            </div>
          </div>
        </div>
      `
    };

    const CombinedDemo = {
      components: { Suspense, Modal },
      setup() {
        const showDashboard = ref(false);
        
        return { showDashboard };
      },
      template: `
        <div>
          <button @click="showDashboard = true">打开异步仪表板</button>
          
          <Teleport to="#modals-container">
            <div v-if="showDashboard" class="modal-overlay" @click.self="showDashboard = false">
              <div class="modal-content" style="max-width: 700px;">
                <Suspense>
                  <template #default>
                    <async-dashboard />
                  </template>
                  <template #fallback>
                    <div class="loading-box">
                      <div class="spinner"></div>
                      <p>加载仪表板数据...</p>
                    </div>
                  </template>
                </Suspense>
                <button @click="showDashboard = false" style="margin-top: 20px;">关闭</button>
              </div>
            </div>
          </Teleport>
          
          <div class="info-box" style="margin-top: 20px;">
            <strong>综合应用：</strong>使用 Teleport 将模态框传送到 body，
            内部使用 Suspense 处理异步组件加载，显示加载状态。
          </div>
        </div>
      `
    };

    createApp({
      components: {
        TeleportModalDemo,
        TeleportNotificationDemo,
        SuspenseDemo,
        CombinedDemo
      }
    }).mount('#app');
  </script>
</body>
</html>
