<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第二十一章：computed 与 watch - JavaScript 示例</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .demo-section {
      border: 1px solid #ddd;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
    .demo-title {
      color: #42b983;
      margin-top: 0;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      background: #42b983;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #369870;
    }
    .info-box {
      background: #f0f8ff;
      padding: 15px;
      border-left: 4px solid #42b983;
      margin: 10px 0;
    }
    .log-box {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-entry {
      margin: 2px 0;
      padding: 2px 5px;
      border-bottom: 1px solid #ddd;
    }
    input, select {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>第二十一章：computed 与 watch</h1>
  <p>本章演示 computed、watch 和 watchEffect 的用法和区别。</p>

  <div id="app">
    <!-- 示例 1：computed 基础 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 1：computed 计算属性</h2>
      <computed-basic-demo></computed-basic-demo>
    </div>

    <!-- 示例 2：watch 基础 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 2：watch 侦听器</h2>
      <watch-basic-demo></watch-basic-demo>
    </div>

    <!-- 示例 3：watchEffect -->
    <div class="demo-section">
      <h2 class="demo-title">示例 3：watchEffect 自动侦听</h2>
      <watch-effect-demo></watch-effect-demo>
    </div>

    <!-- 示例 4：综合应用 -->
    <div class="demo-section">
      <h2 class="demo-title">示例 4：综合应用 - 搜索功能</h2>
      <search-demo></search-demo>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, computed, watch, watchEffect } = Vue;

    // 示例 1：computed 基础
    const ComputedBasicDemo = {
      setup() {
        const firstName = ref('张');
        const lastName = ref('三');
        
        // 只读计算属性
        const fullName = computed(() => {
          return firstName.value + lastName.value;
        });
        
        // 可写计算属性
        const writableFullName = computed({
          get() {
            return firstName.value + ' ' + lastName.value;
          },
          set(newValue) {
            [firstName.value, lastName.value] = newValue.split(' ');
          }
        });
        
        const scores = ref([85, 90, 78, 92]);
        
        // 复杂计算
        const stats = computed(() => {
          const sum = scores.value.reduce((a, b) => a + b, 0);
          const avg = sum / scores.value.length;
          const max = Math.max(...scores.value);
          const min = Math.min(...scores.value);
          
          return { sum, avg: avg.toFixed(1), max, min };
        });
        
        return {
          firstName,
          lastName,
          fullName,
          writableFullName,
          scores,
          stats
        };
      },
      template: `
        <div>
          <h4>只读计算属性</h4>
          <p>姓：{{ firstName }}，名：{{ lastName }}</p>
          <p>全名：{{ fullName }}</p>
          
          <h4>可写计算属性</h4>
          <p>全名（带空格）：{{ writableFullName }}</p>
          <input v-model="writableFullName" placeholder="输入姓名（如：李 四）">
          
          <h4>复杂计算 - 成绩统计</h4>
          <p>成绩：{{ scores.join(', ') }}</p>
          <p>总分：{{ stats.sum }}，平均分：{{ stats.avg }}</p>
          <p>最高分：{{ stats.max }}，最低分：{{ stats.min }}</p>
          
          <div class="info-box">
            <strong>computed 特点：</strong><br>
            1. 自动追踪依赖<br>
            2. 结果缓存，依赖不变不会重新计算<br>
            3. 可以创建可写计算属性
          </div>
        </div>
      `
    };

    // 示例 2：watch 基础
    const WatchBasicDemo = {
      setup() {
        const count = ref(0);
        const user = reactive({
          name: '张三',
          age: 25
        });
        const logs = ref([]);
        
        const addLog = (message) => {
          const time = new Date().toLocaleTimeString();
          logs.value.unshift(`[${time}] ${message}`);
          if (logs.value.length > 10) {
            logs.value.pop();
          }
        };
        
        // 监听 ref
        watch(count, (newVal, oldVal) => {
          addLog(`count 变化: ${oldVal} → ${newVal}`);
        });
        
        // 监听 reactive 对象的属性
        watch(() => user.name, (newVal, oldVal) => {
          addLog(`user.name 变化: ${oldVal} → ${newVal}`);
        });
        
        // 监听多个数据源
        watch([count, () => user.age], ([newCount, newAge], [oldCount, oldAge]) => {
          addLog(`多监听 - count: ${oldCount}→${newCount}, age: ${oldAge}→${newAge}`);
        });
        
        // 立即执行
        watch(count, (newVal) => {
          addLog(`[immediate] 当前 count: ${newVal}`);
        }, { immediate: true });
        
        return {
          count,
          user,
          logs
        };
      },
      template: `
        <div>
          <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
              <h4>操作区域</h4>
              <p>count: {{ count }}</p>
              <button @click="count++">增加 count</button>
              <button @click="count--">减少 count</button>
              
              <p>user.name: {{ user.name }}</p>
              <input v-model="user.name" placeholder="修改姓名">
              
              <p>user.age: {{ user.age }}</p>
              <button @click="user.age++">增加年龄</button>
            </div>
            <div style="flex: 1;">
              <h4>监听日志</h4>
              <div class="log-box">
                <div v-for="(log, index) in logs" :key="index" class="log-entry">
                  {{ log }}
                </div>
              </div>
            </div>
          </div>
        </div>
      `
    };

    // 示例 3：watchEffect
    const WatchEffectDemo = {
      setup() {
        const count = ref(0);
        const message = ref('Hello');
        const status = ref('等待...');
        
        // watchEffect 自动追踪依赖
        watchEffect(() => {
          // 使用了 count 和 message，会自动监听它们
          status.value = `${message.value} - 当前计数: ${count.value}`;
          console.log('watchEffect 执行:', status.value);
        });
        
        // 带清理的 watchEffect
        const timerCount = ref(0);
        
        watchEffect((onCleanup) => {
          const timer = setInterval(() => {
            timerCount.value++;
          }, 1000);
          
          status.value += ` (timer: ${timerCount.value})`;
          
          // 注册清理函数
          onCleanup(() => {
            clearInterval(timer);
            console.log('清理定时器');
          });
        });
        
        return {
          count,
          message,
          status,
          timerCount
        };
      },
      template: `
        <div>
          <p>计数：{{ count }}</p>
          <p>消息：{{ message }}</p>
          <p>状态：{{ status }}</p>
          <p>定时器计数：{{ timerCount }}</p>
          
          <button @click="count++">增加计数</button>
          <button @click="message += '!'">修改消息</button>
          
          <div class="info-box">
            <strong>watchEffect 特点：</strong><br>
            1. 自动追踪依赖，无需手动指定<br>
            2. 立即执行一次<br>
            3. 可以使用 onCleanup 清理副作用<br>
            4. 不会提供旧值
          </div>
        </div>
      `
    };

    // 示例 4：搜索功能
    const SearchDemo = {
      setup() {
        const searchQuery = ref('');
        const searchType = ref('all');
        const isSearching = ref(false);
        const results = ref([]);
        const searchHistory = ref([]);
        
        const allData = [
          { id: 1, name: '苹果手机', category: '电子产品', price: 5999 },
          { id: 2, name: '香蕉牛奶', category: '食品', price: 15 },
          { id: 3, name: '橙子果汁', category: '饮料', price: 12 },
          { id: 4, name: '华为手机', category: '电子产品', price: 4999 },
          { id: 5, name: '苹果派', category: '食品', price: 25 },
          { id: 6, name: '小米手机', category: '电子产品', price: 2999 },
        ];
        
        // 使用 computed 过滤结果
        const filteredResults = computed(() => {
          let filtered = allData;
          
          // 按类型过滤
          if (searchType.value !== 'all') {
            const typeMap = {
              'electronics': '电子产品',
              'food': '食品',
              'drink': '饮料'
            };
            filtered = filtered.filter(item => item.category === typeMap[searchType.value]);
          }
          
          // 按关键词过滤
          if (searchQuery.value) {
            filtered = filtered.filter(item => 
              item.name.toLowerCase().includes(searchQuery.value.toLowerCase())
            );
          }
          
          return filtered;
        });
        
        // 使用 watch 监听搜索并记录历史
        watch(searchQuery, (newQuery) => {
          if (newQuery && !searchHistory.value.includes(newQuery)) {
            searchHistory.value.unshift(newQuery);
            if (searchHistory.value.length > 5) {
              searchHistory.value.pop();
            }
          }
        });
        
        // 使用 watchEffect 模拟搜索加载状态
        watchEffect(() => {
          if (searchQuery.value || searchType.value !== 'all') {
            isSearching.value = true;
            setTimeout(() => {
              isSearching.value = false;
            }, 300);
          }
        });
        
        return {
          searchQuery,
          searchType,
          isSearching,
          filteredResults,
          searchHistory
        };
      },
      template: `
        <div>
          <div style="margin-bottom: 15px;">
            <input 
              v-model="searchQuery" 
              placeholder="搜索商品..."
              style="width: 200px;"
            >
            <select v-model="searchType">
              <option value="all">所有类别</option>
              <option value="electronics">电子产品</option>
              <option value="food">食品</option>
              <option value="drink">饮料</option>
            </select>
            <span v-if="isSearching" style="color: #42b983;">搜索中...</span>
          </div>
          
          <div v-if="searchHistory.length > 0" style="margin-bottom: 15px;">
            <small>搜索历史：</small>
            <span 
              v-for="(query, index) in searchHistory" 
              :key="index"
              style="cursor: pointer; color: #42b983; margin-right: 10px;"
              @click="searchQuery = query"
            >
              {{ query }}
            </span>
          </div>
          
          <p>找到 {{ filteredResults.length }} 个结果</p>
          <ul>
            <li v-for="item in filteredResults" :key="item.id">
              {{ item.name }} - {{ item.category }} - ¥{{ item.price }}
            </li>
          </ul>
          
          <div class="info-box">
            <strong>实际应用场景：</strong><br>
            使用 computed 实时过滤结果，使用 watch 记录搜索历史，使用 watchEffect 处理加载状态。
          </div>
        </div>
      `
    };

    createApp({
      components: {
        ComputedBasicDemo,
        WatchBasicDemo,
        WatchEffectDemo,
        SearchDemo
      }
    }).mount('#app');
  </script>
</body>
</html>
