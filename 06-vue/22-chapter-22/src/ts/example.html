<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第二十二章：生命周期钩子 - TypeScript 示例</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
    .demo-section { border: 1px solid #ddd; padding: 20px; margin: 20px 0; border-radius: 8px; }
    button { padding: 8px 16px; margin: 5px; background: #42b983; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>第二十二章：生命周期钩子（TypeScript）</h1>
  <div id="app">
    <div class="demo-section">
      <button @click="show = !show">{{ show ? '卸载' : '挂载' }}组件</button>
      <ts-lifecycle v-if="show"></ts-lifecycle>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted, onUnmounted } = Vue;

    const TsLifecycle = {
      setup() {
        /**
         * @typedef {Object} User
         * @property {number} id
         * @property {string} name
         */
        
        /** @type {import('vue').Ref<User[]>} */
        const users = ref([]);
        
        /** @type {import('vue').Ref<boolean>} */
        const loading = ref(false);
        
        /**
         * @returns {Promise<User[]>}
         */
        const fetchUsers = async () => {
          loading.value = true;
          await new Promise(resolve => setTimeout(resolve, 1000));
          loading.value = false;
          return [
            { id: 1, name: '张三' },
            { id: 2, name: '李四' }
          ];
        };
        
        onMounted(async () => {
          users.value = await fetchUsers();
        });
        
        return { users, loading };
      },
      template: `
        <div>
          <p v-if="loading">加载中...</p>
          <ul v-else>
            <li v-for="user in users" :key="user.id">{{ user.name }}</li>
          </ul>
        </div>
      `
    };

    createApp({
      components: { TsLifecycle },
      setup() {
        const show = ref(true);
        return { show };
      }
    }).mount('#app');
  </script>
</body>
</html>
