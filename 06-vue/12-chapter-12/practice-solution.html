<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第 12 章练习题答案</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container { max-width: 1000px; margin: 0 auto; }
    
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 40px;
      font-size: 36px;
    }
    
    .exercise-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    .exercise-title {
      color: #667eea;
      font-size: 24px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 3px solid #667eea;
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal {
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow: hidden;
    }
    
    .modal-small { max-width: 400px; }
    .modal-large { max-width: 700px; }
    
    .modal-header {
      padding: 20px;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .modal-body { padding: 20px; overflow-y: auto; }
    
    .modal-footer {
      padding: 15px 20px;
      border-top: 1px solid #dee2e6;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-weight: 600;
      background: #42b883;
      color: white;
    }
    
    button.secondary { background: #6c757d; }
    button.danger { background: #dc3545; }
    
    .form-item { margin-bottom: 20px; }
    .form-item label { display: block; margin-bottom: 8px; font-weight: 600; }
    .form-item input, .form-item select, .form-item textarea {
      width: 100%; padding: 10px; border: 2px solid #dee2e6; border-radius: 8px;
    }
    
    .error { color: #dc3545; font-size: 14px; margin-top: 5px; }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .widget {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      cursor: move;
      transition: all 0.3s ease;
    }
    
    .widget:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .widget.dragging { opacity: 0.5; }
    
    .widget-value { font-size: 36px; font-weight: bold; color: #667eea; margin: 10px 0; }
    
    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      position: relative;
    }
    
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    
    .step-number {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #dee2e6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-bottom: 8px;
    }
    
    .step.active .step-number { background: #667eea; color: white; }
    .step.completed .step-number { background: #42b883; color: white; }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>🎯 第 12 章练习题答案</h1>
      
      <!-- 基础练习：对话框组件 -->
      <div class="exercise-card">
        <h2 class="exercise-title">基础练习：对话框组件</h2>
        
        <button @click="showModal = true">打开对话框</button>
        <button @click="showSmallModal = true" style="margin-left: 10px;">小对话框</button>
        <button @click="showLargeModal = true" style="margin-left: 10px;">大对话框</button>
        
        <my-modal 
          v-model="showModal"
          title="基础对话框"
          @confirm="handleConfirm"
          @close="handleClose"
        >
          <p>这是一个使用 v-model 控制显示/隐藏的对话框组件。</p>
          <p>支持自定义标题、尺寸和事件回调。</p>
        </my-modal>
        
        <my-modal v-model="showSmallModal" title="小对话框" size="small">
          <p>这是小尺寸对话框</p>
        </my-modal>
        
        <my-modal v-model="showLargeModal" title="大对话框" size="large">
          <p>这是大尺寸对话框，可以显示更多内容。</p>
        </my-modal>
      </div>
      
      <!-- 进阶练习：表单组件系统 -->
      <div class="exercise-card">
        <h2 class="exercise-title">进阶练习：表单组件系统</h2>
        
        <my-form ref="formRef" @submit="handleFormSubmit">
          <form-item label="用户名" prop="username" :rules="[{ required: true, min: 3 }]">
            <input v-model="formData.username" placeholder="至少3个字符">
          </form-item>
          
          <form-item label="邮箱" prop="email" :rules="[{ required: true, type: 'email' }]">
            <input v-model="formData.email" placeholder="your@email.com">
          </form-item>
          
          <form-item label="年龄" prop="age" :rules="[{ type: 'number', min: 18 }]">
            <input v-model.number="formData.age" type="number" placeholder="最小18岁">
          </form-item>
        </my-form>
      </div>
      
      <!-- 挑战练习：仪表板系统 -->
      <div class="exercise-card">
        <h2 class="exercise-title">挑战练习：仪表板系统</h2>
        
        <div style="margin-bottom: 20px;">
          <button @click="addWidget">添加小组件</button>
          <button @click="saveLayout" class="secondary" style="margin-left: 10px;">保存布局</button>
          <button @click="undo" :disabled="historyIndex <= 0" style="margin-left: 10px;">撤销</button>
          <button @click="redo" :disabled="historyIndex >= history.length - 1">重做</button>
        </div>
        
        <div class="dashboard-grid">
          <div 
            v-for="(widget, index) in widgets" 
            :key="widget.id"
            class="widget"
            draggable="true"
            @dragstart="dragStart(index)"
            @dragover.prevent
            @drop="drop(index)"
          >
            <h4>{{ widget.title }}</h4>
            <div class="widget-value">{{ widget.value }}</div>
            <p style="color: #6c757d; font-size: 14px;">{{ widget.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, provide, inject } = Vue
    
    // 基础练习：Modal 组件
    const MyModal = {
      props: {
        modelValue: Boolean,
        title: String,
        size: { type: String, default: 'medium' }
      },
      emits: ['update:modelValue', 'confirm', 'close'],
      template: `
        <div v-if="modelValue" class="modal-overlay" @click.self="close">
          <div class="modal" :class="'modal-' + size">
            <div class="modal-header">
              <h3>{{ title }}</h3>
              <button @click="close" style="background: none; color: #333; font-size: 24px;">×</button>
            </div>
            <div class="modal-body">
              <slot></slot>
            </div>
            <div class="modal-footer">
              <button @click="confirm" class="secondary">确认</button>
              <button @click="close">取消</button>
            </div>
          </div>
        </div>
      `,
      setup(props, { emit }) {
        const close = () => {
          emit('update:modelValue', false)
          emit('close')
        }
        
        const confirm = () => {
          emit('confirm')
          close()
        }
        
        // ESC 关闭
        const handleEsc = (e) => {
          if (e.key === 'Escape' && props.modelValue) {
            close()
          }
        }
        
        window.addEventListener('keydown', handleEsc)
        
        return { close, confirm }
      }
    }
    
    // 进阶练习：表单组件
    const FormItem = {
      props: ['label', 'prop', 'rules'],
      setup(props) {
        const form = inject('form')
        const error = ref('')
        
        const validate = () => {
          const value = form.model[props.prop]
          error.value = ''
          
          for (const rule of props.rules || []) {
            if (rule.required && !value) {
              error.value = `${props.label}不能为空`
              return false
            }
            if (rule.min && value.length < rule.min) {
              error.value = `${props.label}至少${rule.min}个字符`
              return false
            }
            if (rule.type === 'email' && value && !value.includes('@')) {
              error.value = '请输入有效的邮箱'
              return false
            }
          }
          return true
        }
        
        provide('validate', validate)
        form.registerField(validate)
        
        return { error }
      },
      template: `
        <div class="form-item">
          <label>{{ label }}</label>
          <slot></slot>
          <div v-if="error" class="error">{{ error }}</div>
        </div>
      `
    }
    
    const MyForm = {
      emits: ['submit'],
      setup(props, { emit }) {
        const fields = []
        const model = reactive({})
        
        provide('form', {
          model,
          registerField: (validate) => fields.push(validate)
        })
        
        const validate = () => {
          return fields.every(field => field())
        }
        
        const handleSubmit = () => {
          if (validate()) {
            emit('submit', { ...model })
          }
        }
        
        return { handleSubmit }
      },
      template: `
        <form @submit.prevent="handleSubmit">
          <slot></slot>
          <div style="margin-top: 20px;">
            <button type="submit">提交</button>
          </div>
        </form>
      `
    }
    
    createApp({
      components: { MyModal, FormItem, MyForm },
      setup() {
        // 基础练习
        const showModal = ref(false)
        const showSmallModal = ref(false)
        const showLargeModal = ref(false)
        
        const handleConfirm = () => {
          alert('确认操作')
        }
        
        const handleClose = () => {
          console.log('对话框关闭')
        }
        
        // 进阶练习
        const formData = reactive({
          username: '',
          email: '',
          age: null
        })
        
        const handleFormSubmit = (data) => {
          alert('表单提交成功:\n' + JSON.stringify(data, null, 2))
        }
        
        // 挑战练习
        const widgets = ref([
          { id: 1, title: '销售额', value: '¥12,345', description: '本月销售额' },
          { id: 2, title: '用户数', value: '1,234', description: '活跃用户' },
          { id: 3, title: '订单数', value: '567', description: '今日订单' }
        ])
        
        let nextId = 4
        const draggedIndex = ref(null)
        const history = ref([JSON.stringify(widgets.value)])
        const historyIndex = ref(0)
        
        const addWidget = () => {
          widgets.value.push({
            id: nextId++,
            title: `组件 ${nextId - 1}`,
            value: Math.floor(Math.random() * 1000),
            description: '新添加的小组件'
          })
          saveState()
        }
        
        const saveState = () => {
          if (historyIndex.value < history.value.length - 1) {
            history.value = history.value.slice(0, historyIndex.value + 1)
          }
          history.value.push(JSON.stringify(widgets.value))
          historyIndex.value++
        }
        
        const dragStart = (index) => {
          draggedIndex.value = index
        }
        
        const drop = (index) => {
          if (draggedIndex.value === null) return
          
          const item = widgets.value[draggedIndex.value]
          widgets.value.splice(draggedIndex.value, 1)
          widgets.value.splice(index, 0, item)
          
          draggedIndex.value = null
          saveState()
        }
        
        const undo = () => {
          if (historyIndex.value > 0) {
            historyIndex.value--
            widgets.value = JSON.parse(history.value[historyIndex.value])
          }
        }
        
        const redo = () => {
          if (historyIndex.value < history.value.length - 1) {
            historyIndex.value++
            widgets.value = JSON.parse(history.value[historyIndex.value])
          }
        }
        
        const saveLayout = () => {
          localStorage.setItem('dashboard-layout', JSON.stringify(widgets.value))
          alert('布局已保存到本地存储')
        }
        
        return {
          showModal, showSmallModal, showLargeModal,
          handleConfirm, handleClose,
          formData, handleFormSubmit,
          widgets, addWidget, dragStart, drop,
          history, historyIndex, undo, redo, saveLayout
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
