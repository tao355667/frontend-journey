<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 实践 - 基础练习答案</title>
    <style>
        :root {
            --primary: #1677ff;
            --bg: #f5f7fb;
            --text: #2c3e50;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: #ffffff;
            border-radius: var(--radius);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        .nav__list {
            display: flex;
            list-style: none;
            gap: 16px;
        }

        .hero {
            margin-top: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 60px 20px;
            border-radius: var(--radius);
            text-align: center;
        }

        .hero__title {
            font-size: 2.2rem;
            margin-bottom: 12px;
        }

        .btn {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 24px;
            background-color: #ffffff;
            color: #4f46e5;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .features {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .feature {
            background: #fff;
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body>
    <main class="container" aria-label="实践项目基础练习">
        <nav class="nav" aria-label="示例导航">
            <strong>前端学习</strong>
            <ul class="nav__list">
                <li>首页</li>
                <li>课程</li>
                <li>联系</li>
            </ul>
        </nav>

        <section class="hero" aria-label="英雄区域">
            <h1 class="hero__title">快速掌握前端技能</h1>
            <p>用清晰的布局与良好的视觉层级构建现代页面。</p>
            <a class="btn" href="#features">开始学习</a>
        </section>

        <section class="features" id="features" aria-label="特性列表">
            <div class="feature">响应式布局</div>
            <div class="feature">模块化样式</div>
            <div class="feature">可维护结构</div>
            <div class="feature">视觉层次清晰</div>
        </section>
    </main>
</body>
</html>
