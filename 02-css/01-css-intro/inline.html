<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内联样式演示</title>
</head>
<body>
    <header class="page-header">
        <h1 style="color: blue; text-align: center;">内联样式示例</h1>
    </header>
    <main class="page-content" aria-label="内联样式内容">
        <p style="font-size: 18px; color: #333; line-height: 1.6;">
            这是一个使用内联样式的段落。内联样式直接写在HTML标签的style属性中。
        </p>
        <section style="background-color: #f0f0f0; padding: 20px; border-radius: 5px; margin: 10px;" aria-label="内联样式注意事项">
            <h2 style="color: #e74c3c;">注意事项</h2>
            <ul style="list-style-type: square;">
                <li style="margin-bottom: 8px;">内联样式优先级最高</li>
                <li style="margin-bottom: 8px;">不利于维护和复用</li>
                <li style="margin-bottom: 8px;">适合快速测试和特殊情况</li>
            </ul>
        </section>
    </main>
</body>
</html>
