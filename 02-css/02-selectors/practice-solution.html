<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 选择器 - 基础练习答案</title>
    <style>
        /* 通用选择器：重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #2c3e50;
            padding: 20px;
        }

        /* 标签选择器 */
        p {
            font-size: 16px;
            line-height: 1.7;
            margin: 8px 0;
        }

        /* ID 选择器 */
        #logo {
            font-size: 24px;
            font-weight: bold;
            color: #1677ff;
        }

        /* 类选择器 */
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            margin-right: 8px;
            transition: transform 0.2s ease;
        }

        .btn--primary { background-color: #1677ff; }
        .btn--secondary { background-color: #7f8c8d; }
        .btn--warning { background-color: #e67e22; }

        .btn:hover { transform: translateY(-2px); }

        /* 子选择器 */
        .nav > li {
            list-style: none;
            display: inline-block;
            margin-right: 12px;
        }

        /* 后代选择器 */
        .article h3 {
            margin-top: 12px;
        }

        .article p {
            color: #34495e;
        }

        /* 相邻兄弟选择器 */
        h3 + p {
            color: #e74c3c;
            font-weight: bold;
        }

        /* 通用兄弟选择器 */
        .steps .step--active ~ .step {
            opacity: 0.6;
        }

        /* 伪类：链接 */
        a:focus {
            outline: 2px solid #1677ff;
            outline-offset: 2px;
        }

        a:hover { text-decoration: underline; }
        a:active { color: #27ae60; }

        /* 结构性伪类 */
        .stripe-list li:nth-child(odd) { background-color: #eef2ff; }
        .stripe-list li:nth-child(even) { background-color: #ffffff; }

        /* 表单伪类 */
        input:required { border-color: #e67e22; }
        input:valid { border-color: #27ae60; }
        input:invalid { border-color: #e74c3c; }

        /* 否定伪类 */
        .tags li:not(.tag--featured) { color: #7f8c8d; }

        .card {
            background-color: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-top: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            max-width: 320px;
            padding: 8px 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <header>
        <div id="logo">MyStyle</div>
        <p>使用不同选择器完成基础练习。</p>
    </header>

    <main aria-label="选择器基础练习">
        <section class="card" aria-label="基础选择器示例">
            <h2>按钮样式</h2>
            <a href="#" class="btn btn--primary">主要按钮</a>
            <a href="#" class="btn btn--secondary">次要按钮</a>
            <a href="#" class="btn btn--warning">警告按钮</a>
        </section>

        <section class="card" aria-label="组合选择器示例">
            <h2>导航与文章</h2>
            <ul class="nav" aria-label="示例导航">
                <li><a href="#">首页</a></li>
                <li><a href="#">文章</a></li>
                <li><a href="#">关于</a></li>
            </ul>

            <div class="article">
                <h3>文章标题</h3>
                <p>标题后的第一个段落会被相邻兄弟选择器高亮。</p>
                <p>这是第二个段落。</p>
            </div>

            <ul class="steps">
                <li class="step">步骤 1</li>
                <li class="step step--active">步骤 2（激活）</li>
                <li class="step">步骤 3</li>
                <li class="step">步骤 4</li>
            </ul>
        </section>

        <section class="card" aria-label="伪类示例">
            <h2>伪类与表单</h2>
            <ul class="stripe-list">
                <li>列表项 1</li>
                <li>列表项 2</li>
                <li>列表项 3</li>
                <li>列表项 4</li>
            </ul>

            <div class="form-group">
                <label for="email">邮箱（必填）</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <ul class="tags">
                <li class="tag">普通标签</li>
                <li class="tag tag--featured">精选标签</li>
                <li class="tag">普通标签</li>
            </ul>
        </section>
    </main>
</body>
</html>
