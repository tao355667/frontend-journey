<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语义化标签练习</title>
</head>
<body>
    <header>
        <h1>我的技术博客</h1>
        <nav aria-label="主导航">
            <a href="#home">首页</a>
            <a href="#articles">文章</a>
            <a href="#about">关于</a>
        </nav>
    </header>

    <main>
        <article>
            <header>
                <h2>HTML 语义化的重要性</h2>
                <p><time datetime="2026-01-30">发布于 2026-01-30</time></p>
            </header>

            <section>
                <h3>为什么使用语义化标签</h3>
                <p>语义化标签让代码更有意义，提升可读性和可维护性。</p>
            </section>

            <section>
                <h3>常用标签介绍</h3>
                <p>header、nav、main、section、article、aside、footer 等标签让页面结构更清晰。</p>
            </section>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 我的技术博客</p>
    </footer>
</body>
</html>
