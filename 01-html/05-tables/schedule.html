<body>
    <h1 style="text-align: center;">周课程表</h1>
    <table>
        <thead>
            <tr>
                <th>节次</th>
                <th>周一</th>
                <th>周二</th>
                <th>周三</th>
                <th>周四</th>
                <th>周五</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>第1-2节</td>
                <td rowspan="2">语文</td>
                <td>数学</td>
                <td rowspan="2">英语</td>
                <td>物理</td>
                <td rowspan="2">化学</td>
            </tr>
            <tr>
                <td>第3-4节</td>
                <td>历史</td>
                <td>生物</td>
            </tr>
            <tr class="lunch">
                <td colspan="6">午休时间 (12:00 - 13:00)</td>
            </tr>
            <tr>
                <td>第5-6节</td>
                <td>数学</td>
                <td rowspan="2">语文</td>
                <td>地理</td>
                <td rowspan="2">数学</td>
                <td>体育</td>
            </tr>
            <tr>
                <td>第7-8节</td>
                <td>英语</td>
                <td>美术</td>
                <td>音乐</td>
            </tr>
        </tbody>
    </table>
</body>
