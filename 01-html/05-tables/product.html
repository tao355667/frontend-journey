<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>产品对比表</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>产品名称</th>
                <th>价格</th>
                <th>库存</th>
                <th>状态</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>产品A</td>
                <td>￥100</td>
                <td>50</td>
                <td>有货</td>
            </tr>
            <tr>
                <td>产品B</td>
                <td>￥150</td>
                <td>20</td>
                <td>缺货</td>
            </tr>
            <tr>
                <td>产品C</td>
                <td>￥200</td>
                <td>30</td>
                <td>有货</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">总库存</td>
                <td>100</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
