<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格练习</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f5f5f5; font-weight: bold; }
        caption { caption-side: top; text-align: center; margin-bottom: 10px; font-weight: bold; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1>学生信息表</h1>

    <table>
        <caption>2026 年春季学期学生信息</caption>
        <thead>
            <tr>
                <th>姓名</th>
                <th>年龄</th>
                <th>城市</th>
                <th>专业</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>张三</td>
                <td>20</td>
                <td>北京</td>
                <td>计算机科学</td>
            </tr>
            <tr>
                <td>李四</td>
                <td>21</td>
                <td>上海</td>
                <td>软件工程</td>
            </tr>
            <tr>
                <td>王五</td>
                <td>19</td>
                <td>广州</td>
                <td>人工智能</td>
            </tr>
            <tr>
                <td>赵六</td>
                <td>22</td>
                <td>深圳</td>
                <td>数据科学</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
