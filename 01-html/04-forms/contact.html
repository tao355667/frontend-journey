<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系表单</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        form {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 150px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-btn {
            background-color: #4CAF50;
            color: white;
        }
        .reset-btn {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <h1>联系我们</h1>
    <form>
        <div class="form-group">
            <label for="name">姓名 <span style="color: red;">*</span></label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">邮箱 <span style="color: red;">*</span></label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="subject">咨询主题</label>
            <select id="subject" name="subject">
                <option value="">请选择主题</option>
                <option value="sales">销售咨询</option>
                <option value="support">技术支持</option>
                <option value="feedback">意见反馈</option>
                <option value="other">其他</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">留言内容</label>
            <textarea id="message" name="message" placeholder="请输入您的留言..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="submit-btn">提交</button>
            <button type="reset" class="reset-btn">重置</button>
        </div>
    </form>
</body>
</html>
